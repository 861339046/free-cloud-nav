<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提交收录 · 免费云服务导航</title>
<meta name="description" content="向免费云服务导航提交收录：填写服务名称、分类、官网链接与简介，审核通过后即可上墙展示，面向中文个人开发者。">
<meta name="keywords" content="提交收录,免费云服务,导航站,开发者工具">
<meta property="og:title" content="提交收录 · 免费云服务导航">

<meta property="og:type" content="website">
<meta property="og:url" content="https://keting.eu.org/submit">
<link rel="canonical" href="https://keting.eu.org/submit">
<style>
  :root{
    --bg:#f7f9fc; --card:#ffffff; --ink:#1f2937; --muted:#64748b;
    --brand:#2563eb; --brand-soft:#eff6ff; --line:#e5e7eb; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
  a{color:var(--brand)}
  .navbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .navinner{max-width:1020px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .logo{font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;white-space:nowrap}
  .navlinks{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto}
  .navlinks a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:600}
  .navlinks a:hover{color:var(--brand)}
  .navlinks a.active{color:var(--brand)}
  header{padding:36px 20px 24px;text-align:center;background:linear-gradient(180deg,#eef4ff,#f7f9fc)}
  h1{margin:0 0 8px;font-size:26px}
  .sub{color:var(--muted);max-width:640px;margin:0 auto;font-size:15px}
  .btn{display:inline-block;margin-top:14px;padding:9px 18px;background:var(--brand);color:#fff;text-decoration:none;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
  .btn:hover{opacity:.92}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
  .wrap{max-width:640px;margin:0 auto;padding:30px 20px 70px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
  .field{margin-bottom:18px}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
  label .req{color:#dc2626}
  .hint{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
  input[type=text],input[type=url],input[type=email],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink)
  }
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  textarea{min-height:90px;resize:vertical}
  .hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
  .msg{display:none;margin-top:14px;padding:12px 16px;border-radius:10px;font-size:14px}
  .msg.ok{display:block;background:#ecfdf5;border-left:4px solid #10b981;color:#065f46}
  .msg.err{display:block;background:#fef2f2;border-left:4px solid #ef4444;color:#991b1b}
  .rules{background:var(--brand-soft);border-left:4px solid var(--brand);padding:12px 16px;border-radius:8px;color:#1e40af;margin:0 0 20px;font-size:14px}
  .rules ul{margin:6px 0 0;padding-left:18px}
  .rules li{font-size:13px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:24px;border-top:1px solid var(--line)}
  footer a{color:var(--brand);text-decoration:none}
</style>
</head>
<body>
<nav class="navbar">
  <div class="navinner">
    <a class="logo" href="/">免费云服务导航</a>
    <div class="navlinks">
      <a href="/">首页</a>
      <a href="tutorials">实测教程</a>
      <a class="active" href="submit">提交收录</a>
      <a href="mailto:861339046@qq.com?subject=免费云服务导航-商务合作">商务合作</a>
    </div>
  </div>
</nav>

<header>
  <h1>提交收录</h1>
  <p class="sub">发现了好用的免费云服务？填个表提交，审核通过后即可上墙，让更多中文开发者看到。</p>
  <a class="btn ghost" href="/">← 返回免费云导航</a>
</header>
<div class="wrap">
  <div class="card">
    <div class="rules">
      <strong>收录标准（请先确认）</strong>
      <ul>
        <li>有真实可用的<strong>免费层 / 免费额度</strong>，非仅限首月试用；</li>
        <li>面向开发者（云服务、托管、数据库、存储、工具等）；</li>
        <li>合规合法，<strong>违规 / 灰产服务一律不收</strong>；</li>
        <li>审核通过后 1–3 天内上墙，不保证全部收录。</li>
      </ul>
    </div>
    <form id="form" novalidate>
      <div class="field">
        <label>服务名称 <span class="req">*</span></label>
        <input type="text" id="name" maxlength="40" placeholder="例如：Backblaze B2" required>
      </div>
      <div class="field">
        <label>分类 <span class="req">*</span> <span class="hint">选最贴近的一类</span></label>
        <select id="category" required>
          <option value="">请选择…</option>
          <option>静态托管</option>
          <option>后端与数据库</option>
          <option>计算与服务器</option>
          <option>存储</option>
          <option>其他工具</option>
        </select>
      </div>
      <div class="field">
        <label>官网链接 <span class="req">*</span></label>
        <input type="url" id="url" maxlength="200" placeholder="https://…" required>
      </div>
      <div class="field">
        <label>一句话简介 <span class="req">*</span> <span class="hint">20–100 字，说清它是干什么的</span></label>
        <textarea id="description" maxlength="150" placeholder="例如：对象存储，免费 10GB，S3 兼容接口。" required></textarea>
      </div>
      <div class="field">
        <label>坑 / 注意事项 <span class="hint">选填，很有价值，会展示在卡片上</span></label>
        <textarea id="note" maxlength="150" placeholder="例如：免费层存储有限；需绑卡验证。" ></textarea>
      </div>
      <div class="field">
        <label>联系邮箱 <span class="hint">选填，仅用于收录结果通知，不公开</span></label>
        <input type="email" id="email" maxlength="80" placeholder="you@example.com">
      </div>
      <!-- 蜜罐字段：人类不可见，机器人填了直接拒收 -->
      <div class="hp" aria-hidden="true">
        <label>请勿填写此字段<input type="text" id="website" tabindex="-1" autocomplete="off"></label>
      </div>
      <button type="submit" class="btn" id="submitBtn">提交收录申请</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>
<footer>
  <div>提交即表示同意本站对内容进行编辑、审核与展示。</div>
  <div><a href="privacy">隐私政策</a> · <a href="tutorials">实测教程</a> · <a href="/">返回导航</a></div>
</footer>
<script>
// ====== Supabase 配置：把下面两行换成您自己项目的值（Settings → API）======
const SUPABASE_URL = "https://quqqeccjuoptbtqlecmw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mqsQyEqOfKPYEz_VLv1VkA_5bW8eyw_";
// ========================================================================

const form = document.getElementById('form');
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');

function show(type, text) {
  msg.className = 'msg ' + type;
  msg.textContent = text;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  show('', '');

  // 蜜罐：机器人填了直接假成功
  if (document.getElementById('website').value) {
    show('ok', '已收到，感谢您的提交！');
    form.reset();
    return;
  }

  const name = document.getElementById('name').value.trim();
  const category = document.getElementById('category').value;
  const url = document.getElementById('url').value.trim();
  const description = document.getElementById('description').value.trim();
  const note = document.getElementById('note').value.trim();
  const email = document.getElementById('email').value.trim();

  if (!name || !category || !description) { show('err', '请填写带 * 的必填项。'); return; }
  if (!/^https?:\/\/.+\..+/.test(url)) { show('err', '官网链接请以 http(s):// 开头，填写完整域名。'); return; }
  if (description.length < 10) { show('err', '简介太短了，至少 10 个字，说清这个服务是干什么的。'); return; }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { show('err', '邮箱格式看起来不对，请检查。'); return; }

  btn.disabled = true;
  btn.textContent = '提交中…';
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/submissions', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify([{
        name, category, url, description,
        note: note || null,
        email: email || null,
        status: 'pending'
      }])
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    show('ok', '提交成功！已收到您的申请，审核通过后 1–3 天内上墙。');
    form.reset();
  } catch (err) {
    show('err', '提交失败（' + err.message + '）。请稍后重试，或到 GitHub Issue 提交：https://github.com/861339046/free-cloud-nav/issues/new');
  } finally {
    btn.disabled = false;
    btn.textContent = '提交收录申请';
  }
});
</script>
<!-- 百度自动推送 -->
<script>
(function(){
  var bp = document.createElement('script');
  bp.src = 'https://zz.bdstatic.com/linksubmit/push.js';
  var s = document.getElementsByTagName('script')[0];
  s.parentNode.insertBefore(bp, s);
})();
</script>
</body>
</html>
