<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>信仰交易录 · 万法商铺 (v2.0 大改)</title>
<style>
  :root{
    --faith:#f4c542; --nature:#4ec9a8; --energy:#b07bff; --karma:#e05a5a; --rep:#c98be0;
    --bg1:#fbe9f3; --bg2:#e9e4fb; --card:#ffffffee; --ink:#4a3b55;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}
  #app{max-width:540px;margin:0 auto;padding:10px 12px 104px}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(160deg,#fff0f7ee,#efe9ffee);
    backdrop-filter:blur(6px);border-radius:16px;padding:10px 12px;box-shadow:0 4px 14px #d9b8d855;margin-bottom:10px}
  .stat{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
  .pill{border-radius:999px;padding:3px 9px;background:#fff;box-shadow:0 2px 6px #0001;white-space:nowrap}
  .pill.faith{color:#9a7400;border:1px solid #f4c54266}
  .pill.nature{color:#1f7a63;border:1px solid #4ec9a866}
  .pill.energy{color:#5a2da0;border:1px solid #b07bff66}
  .pill.karma{color:#a33232;border:1px solid #e05a5a66}
  .pill.rep{color:#7a3fa0;border:1px solid #c98be066}
  .pill.shop{color:#6a4bb0;border:1px solid #9b7be066}
  .pill.combo{color:#d2691e;border:1px solid #ff9a4d66;font-weight:700}
  nav{display:flex;gap:5px;position:fixed;bottom:0;left:0;right:0;max-width:540px;margin:0 auto;
    background:#fff8;backdrop-filter:blur(8px);padding:8px;border-top:1px solid #fff;z-index:6}
  nav button{flex:1;border:0;background:#fff;border-radius:12px;padding:8px 1px;font-size:12px;color:var(--ink);
    box-shadow:0 2px 6px #0001;cursor:pointer}
  nav button.active{background:linear-gradient(160deg,#ffd9ee,#d9ccff);font-weight:700}
  .card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 3px 12px #cdb6e044}
  .card h3{margin:0 0 8px;font-size:15px}
  button.act{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:0;border-radius:12px;
    background:#fff;box-shadow:0 2px 6px #0001;cursor:pointer;font-size:14px;color:var(--ink)}
  button.act:active{transform:scale(.98)}
  button.act .sub{display:block;font-size:11px;color:#9a8aa5;margin-top:2px}
  .tag{display:inline-block;font-size:11px;border-radius:8px;padding:1px 7px;margin-right:4px}
  .t-faith{background:#f4c54222;color:#9a7400}
  .t-nature{background:#4ec9a822;color:#1f7a63}
  .t-energy{background:#b07bff22;color:#5a2da0}
  .t-goods{background:#c98be022;color:#7a3fa0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .merit{aspect-ratio:1;border-radius:12px;background:linear-gradient(160deg,#fff,#f3ecff);display:flex;
    flex-direction:column;align-items:center;justify-content:center;font-size:12px;text-align:center;box-shadow:0 2px 6px #0001}
  .merit .e{font-size:26px}
  .merit .c{font-weight:700;color:#7a3fa0}
  .bar{height:8px;border-radius:999px;background:#eee;overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff9ecf,#9b7be0)}
  .bar>i.energy{background:linear-gradient(90deg,#c79bff,#7b4bd0)}
  #toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  .toast{background:#4a3b55ee;color:#fff;padding:7px 14px;border-radius:999px;font-size:13px;animation:pop .3s ease, fade 2.6s forwards}
  .toast.faith{background:#9a7400ee}.toast.nature{background:#1f7a63ee}.toast.energy{background:#5a2da0ee}
  .toast.karma{background:#a33232ee}.toast.rep{background:#7a3fa0ee}.toast.disc{background:#b07bffee}
  .toast.crit{background:#e07b1fee;font-weight:800;font-size:15px}
  @keyframes pop{from{transform:translateY(-8px) scale(.9);opacity:0}to{transform:none;opacity:1}}
  @keyframes fade{0%,70%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
  .muted{color:#9a8aa5;font-size:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .being{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #0001}
  .being .ic{font-size:22px}
  .being .nm{font-size:13px;font-weight:600}
  .small{font-size:12px}
  .ach{display:inline-block;background:#ffe6f4;color:#a3447f;border-radius:8px;padding:3px 8px;margin:3px;font-size:12px}
  .relic{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #0001}
  .relic .ic{font-size:24px;width:30px;text-align:center}
  .relic .nm{font-weight:600;font-size:13px}
  .perk{font-size:12px;padding:4px 0;color:#5a2da0}
  .perk.off{color:#bbaac9}
  #err{position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#a33232;color:#fff;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5;white-space:pre-wrap;box-shadow:0 4px 14px #0006}

  /* ===== 动态店铺 DOM 版（不依赖 canvas） ===== */
  #shopWrap{position:relative;padding:0;overflow:hidden;border-radius:16px}
  .shop-stage{position:relative;width:100%;height:360px;overflow:hidden;border-radius:16px;
    background:linear-gradient(160deg,#523f6e 0%,#332748 55%,#241a33 100%);
    box-shadow:0 4px 18px #cdb6e055}
  .shop-stage::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,0.02) 0 1px,transparent 1px 34px)}
  .shop-stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:16px;
    box-shadow:inset 0 0 120px rgba(0,0,0,0.45)}
  .shop-window{position:absolute;right:18px;top:16px;width:140px;height:100px;border-radius:14px;overflow:hidden;z-index:2;
    background:linear-gradient(180deg,#2a2350,#0e0a22);border:3px solid #6a5590;box-shadow:0 0 30px rgba(120,90,200,0.25)}
  .shop-window .moon{position:absolute;right:18px;top:16px;width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 40% 40%,#fff7d6,#ffe9a8);box-shadow:0 0 18px #fff7d655}
  .shop-window .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 2s infinite ease-in-out}
  @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
  .lantern{position:absolute;top:28px;width:20px;height:26px;border-radius:50%;background:#ff6b6b;z-index:2;
    box-shadow:0 0 26px 10px rgba(255,190,120,0.4);animation:sway 3s ease-in-out infinite;transform-origin:top center}
  .lantern::before{content:"";position:absolute;left:50%;top:-12px;width:2px;height:14px;background:#7a5a3a;transform:translateX(-50%)}
  .lantern::after{content:"";position:absolute;left:50%;bottom:-12px;width:2px;height:12px;background:#ffcf4d;transform:translateX(-50%)}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .floor{position:absolute;left:0;right:0;bottom:0;height:74px;z-index:1;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,0.12) 0 1px,transparent 1px 24px),linear-gradient(180deg,#7a4f3a,#4a2f24)}
  .counter{position:absolute;left:0;right:0;bottom:0;height:62px;z-index:6;border-top:3px solid #caa06a;
    background-image:repeating-linear-gradient(90deg,rgba(0,0,0,0.12) 0 1px,transparent 1px 24px),linear-gradient(180deg,#9a6440,#5b3a29)}
  .jar{position:absolute;width:14px;height:14px;border-radius:50%;background:currentColor;z-index:2;box-shadow:0 0 16px 4px currentColor}
  .furnace{position:absolute;right:18px;bottom:70px;width:40px;height:54px;border-radius:10px;z-index:2;background:#3a2a4a;border:2px solid #5a4a7d;box-shadow:inset 0 4px 8px #0006}
  .energy-orb{position:absolute;width:28px;height:28px;border-radius:50%;z-index:2;
    background:radial-gradient(circle at 40% 40%,#f0e0ff,#b07bff);
    box-shadow:0 0 26px 8px rgba(176,123,255,0.55);transition:all .4s ease;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .shop-girl{position:absolute;left:10px;bottom:30px;width:140px;height:196px;z-index:5;transform-origin:bottom center;animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .shop-girl.nod{animation:nod .5s ease}
  @keyframes nod{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(2px) rotate(3deg)}}
  .shop-girl .eye{transform-origin:center;animation:blink 4.6s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
  .girl-aura{filter:drop-shadow(0 0 12px rgba(176,123,255,0.7))}
  .cust-layer{position:absolute;inset:0;z-index:5}
  .customer{position:absolute;bottom:70px;left:0;margin-left:-32px;width:64px;height:104px;z-index:5;
    transform:translateX(var(--tx,560px));transition:transform 1.2s cubic-bezier(.25,.9,.3,1),opacity .6s;cursor:pointer}
  .customer .body{position:absolute;left:8px;top:28px;width:48px;height:54px;border-radius:50% 50% 46% 46%;
    background:var(--cc,#ffd0e6);opacity:.95;box-shadow:0 0 18px 3px var(--cc,#ffd0e6)}
  .customer .face{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:36px;line-height:1;filter:drop-shadow(0 2px 3px #0007)}
  .customer .plate{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);white-space:nowrap;
    background:rgba(0,0,0,0.42);color:#fff;font-size:11px;padding:1px 6px;border-radius:8px}
  .customer .bubble{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;
    background:#ffffffe8;color:#4a3b55;font-size:13px;padding:3px 8px;border-radius:9px;box-shadow:0 2px 6px #0002;font-weight:600}
  .customer .pref{position:absolute;left:50%;top:-52px;transform:translateX(-50%);white-space:nowrap;
    background:#fff4d6;color:#9a7400;font-size:10px;padding:1px 6px;border-radius:7px;border:1px solid #f4c54266}
  .customer .voice{position:absolute;left:50%;top:-72px;transform:translateX(-50%);white-space:nowrap;max-width:170px;
    background:rgba(123,75,160,0.92);color:#fff;font-size:10px;padding:2px 6px;border-radius:8px}
  .customer .urgent{position:absolute;left:50%;top:-92px;transform:translateX(-50%);white-space:nowrap;
    background:#ff6b3d;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;animation:flash .8s infinite}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:.5}}
  .customer .ring{position:absolute;left:2px;top:18px;width:60px;height:60px;z-index:-1}
  .customer .ring circle{fill:none;stroke-width:4;stroke-linecap:round}
  .customer .ring .bg{stroke:rgba(0,0,0,0.3)}
  .customer .ring .fg{stroke:#4ec9a8;transition:stroke-dashoffset .1s linear}
  .customer.urgentc .ring .fg{stroke:#ff8a4d}
  .customer.happy{transform:translateX(-260px)!important;opacity:0;transition:transform .9s ease-in,opacity .9s}
  .customer.sad{transform:translateX(660px)!important;opacity:0;transition:transform .9s ease-in,opacity .9s}
  .float-layer{position:absolute;inset:0;pointer-events:none;z-index:8}
  .float{position:absolute;font-weight:700;font-size:15px;text-shadow:0 1px 3px #0009;animation:floatUp 1.4s ease-out forwards}
  .float.crit{font-size:22px;color:#ffb84d!important;text-shadow:0 0 8px #ff7a1f,0 1px 3px #0009}
  @keyframes floatUp{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-46px) scale(1.1)}}
  .particle{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:9;
    animation:burst .7s ease-out forwards}
  @keyframes burst{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--px),var(--py)) scale(.3)}}
  .shop-top{position:absolute;left:12px;top:10px;color:#fff;font-size:12px;text-shadow:0 1px 2px #0008;line-height:1.6;pointer-events:none;z-index:7}
  .shop-top .t1{font-size:15px;font-weight:700}
  .shop-top .combo{color:#ffb84d;font-weight:800}
  .shop-hint{position:absolute;left:10px;bottom:8px;font-size:11px;color:#fff8;text-shadow:0 1px 2px #0006;pointer-events:none;z-index:7}

  /* 矢量氛围：星云 / 视差星空 / 上升光尘 */
  .nebula{position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(240px 140px at 78% 12%,rgba(176,123,255,.22),transparent 70%),
               radial-gradient(200px 120px at 12% 20%,rgba(255,158,207,.14),transparent 70%),
               radial-gradient(260px 160px at 50% 92%,rgba(255,205,90,.10),transparent 70%)}
  .starfield{position:absolute;inset:0;z-index:1;pointer-events:none}
  .starfield .s{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
  .spark{position:absolute;width:4px;height:4px;border-radius:50%;z-index:2;pointer-events:none;
    background:radial-gradient(circle,#ffffff88 0%,currentColor 45%,transparent 70%);
    animation:rise linear infinite;opacity:.85}
  @keyframes rise{from{transform:translateY(0);opacity:.9}70%{opacity:.7}to{transform:translateY(-180px);opacity:0}}
  .energy-orb::after{content:"";position:absolute;inset:-7px;border-radius:50%;
    border:1.5px dashed rgba(255,255,255,.5);animation:orbit 6s linear infinite}
  @keyframes orbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  /* 开场标题 + 序章剧情 */
  #splash,#story{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    background:url('assets/title.webp') center/cover no-repeat;transition:opacity .5s}
  #splash::before,#story::before{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(20,10,35,0) 28%,rgba(20,10,35,.8) 76%,rgba(20,10,35,.94))}
  #splash .t-wrap,#story .t-wrap{position:relative;z-index:1;text-align:center;color:#fff;padding:0 20px 42px}
  #splash h1{margin:0;font-size:34px;letter-spacing:6px;text-shadow:0 2px 18px rgba(176,123,255,.9),0 1px 3px #000}
  #splash .t-sub{margin-top:6px;font-size:13px;color:#e8d9ff;text-shadow:0 1px 3px #000}
  #splash .t-desc{margin-top:10px;font-size:12px;color:#d9c9f5;max-width:330px;margin:10px auto 0;line-height:1.7;text-shadow:0 1px 2px #000}
  .start{margin-top:18px;border:0;cursor:pointer;font-size:16px;font-weight:700;color:#4a2a6b;
    background:linear-gradient(160deg,#ffe9a8,#f4c542);padding:12px 46px;border-radius:999px;
    box-shadow:0 6px 22px rgba(244,197,66,.45);animation:pulse 2s ease-in-out infinite}
  #story .story-text{font-size:14px;line-height:1.9;color:#f3e9ff;max-width:340px;margin:0 auto 16px;text-shadow:0 1px 3px #000;min-height:90px}
  #story .story-next{margin-top:6px;border:0;cursor:pointer;font-size:15px;font-weight:700;color:#4a2a6b;
    background:linear-gradient(160deg,#ffd9ee,#d9ccff);padding:10px 36px;border-radius:999px;box-shadow:0 4px 16px #0006}
  .bye{opacity:0;pointer-events:none}

  /* 事件抉择模态 */
  #eventModal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(20,10,35,.72);backdrop-filter:blur(4px);padding:18px}
  #eventModal .ev-card{background:linear-gradient(160deg,#fff7fc,#efe9ff);border-radius:20px;padding:20px 18px;max-width:420px;width:100%;box-shadow:0 12px 40px #0008;animation:pop .35s ease}
  #eventModal .ev-icon{font-size:44px;text-align:center}
  #eventModal h2{margin:8px 0 6px;font-size:18px;text-align:center;color:#5a2da0}
  #eventModal .ev-desc{font-size:13px;line-height:1.7;color:#5a4b66;margin-bottom:14px;text-align:center}
  #eventModal .ev-choice{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 13px;border:0;border-radius:12px;
    background:#fff;box-shadow:0 2px 6px #0001;cursor:pointer;font-size:13px;color:var(--ink)}
  #eventModal .ev-choice:active{transform:scale(.98)}
  #eventModal .ev-choice .ce{display:block;font-size:11px;color:#9a8aa5;margin-top:3px}

  /* 任务横幅 */
  .task{background:linear-gradient(160deg,#fff4fb,#f0e9ff);border-radius:12px;padding:9px 11px;margin-bottom:8px;box-shadow:0 2px 6px #cdb6e044}
  .task .tn{font-size:13px;font-weight:700;color:#7a3fa0}
  .task .td{font-size:11px;color:#9a8aa5;margin:2px 0 5px}
  .task .bar{height:6px}
  .task.done{opacity:.7}
</style>
</head>
<body>
<div id="splash">
  <div class="t-wrap">
    <h1>信仰交易录</h1>
    <div class="t-sub">万法商铺 · 诸天位面商城</div>
    <div class="t-desc">诸天万界的生灵会来店里，用她们的需要换走货品。成交后，偶尔会留下「超凡物品」——把它炼成无所不能的能量，一点一点，直到无敌。</div>
    <button class="start" id="startBtn">🌸 开始营业</button>
  </div>
</div>
<div id="story" style="display:none">
  <div class="t-wrap">
    <div class="story-text" id="storyText"></div>
    <button class="story-next" id="storyNext">继续</button>
  </div>
</div>
<div id="app">
  <header>
    <div class="stat">
      <span class="pill faith">✦信仰 <b id="s-faith">0</b></span>
      <span class="pill nature">❀自然 <b id="s-nature">0</b></span>
      <span class="pill energy">🔮能量 <b id="s-energy">0</b></span>
      <span class="pill rep">★声望 <b id="s-rep">0</b></span>
      <span class="pill karma">☣业障 <b id="s-karma">0</b></span>
      <span class="pill shop">🏠店Lv<b id="s-shop">1</b> · 位格<b id="s-plane">1</b></span>
      <span class="pill combo" id="s-combo-wrap" style="display:none">🔥连击 <b id="s-combo">0</b></span>
    </div>
    <div class="muted small" style="margin-top:6px">神格 Lv<b id="s-deity">1</b> · 累计信仰 <b id="s-faithTotal">0</b> · 成交 <b id="s-deals">0</b> · 货仓 <b id="s-goods">0</b> · 无敌 <b id="s-inv">未</b></div>
  </header>
  <main id="view" style="display:none"></main>
  <div id="shopView" style="display:block">
    <div class="card" id="shopWrap">
      <div class="shop-stage" id="shopStage">
        <div class="nebula"></div>
        <div class="starfield" id="starfield"></div>
        <div class="shop-window"><div class="moon"></div>
          <div class="star" style="left:18%;top:30%"></div>
          <div class="star" style="left:42%;top:18%;animation-delay:.6s"></div>
          <div class="star" style="left:70%;top:46%;animation-delay:1.1s"></div>
          <div class="star" style="left:30%;top:62%;animation-delay:1.6s"></div>
          <div class="star" style="left:60%;top:24%;animation-delay:.3s"></div>
        </div>
        <div class="lantern" style="left:30%"></div>
        <div class="lantern" style="left:74%;animation-delay:1.2s"></div>
        <div class="jar" style="left:18px;top:120px;color:#ff9ecf"></div>
        <div class="jar" style="left:18px;top:150px;color:#9be0c8"></div>
        <div class="jar" style="right:18px;top:120px;color:#ffd86b"></div>
        <div class="jar" style="right:18px;top:150px;color:#b07bff"></div>
        <div class="floor"></div>
        <div class="counter"></div>
        <div class="furnace"></div>
        <div class="energy-orb" id="energyOrb"></div>
        <svg class="shop-girl" id="shopGirl" viewBox="0 0 140 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdaef0"/><stop offset="1" stop-color="#8e6fc7"/></linearGradient>
            <linearGradient id="dressSh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".35"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#5a3a8a" stop-opacity=".4"/></linearGradient>

function genReq(b){
  const nItems = b.tier<=1 ? 1 : (Math.random()<0.5?1:2);
  const req=[]; const used=new Set();
  for(let i=0;i<nItems;i++){
    let g, tries=0;
    do{ g=GOODS_ORDER[rand(0,GOODS_ORDER.length-1)]; tries++; }while(used.has(g)&&tries<6);
    used.add(g);
    req.push({good:g, n: rand(1, 2+b.tier)});
  }
  return req;
}
function beingUnlocked(b,S){
  if(b.tier===1) return true;
  if(b.tier===2) return S.shop.level>=2;
  if(b.tier===3) return S.shop.level>=3;
  if(b.tier===4) return S.shop.level>=3 && S.reputation>=30;
  return false;
}

function defaultState(){
  const relics={}; BEINGS.forEach(b=>relics[b.relic]=0);
  const tasks={}; TUTORIAL.forEach(t=>tasks[t.id]=false);
  return {
    faithTotal:0, faithCurrent:0, natureCurrency:200, energy:0, karma:0,
    deityLevel:1, shop:{level:1}, reputation:0, plane:1, invincible:false, discovered:false,
    goods:{食物:2,知识:2,旧物:2,观想:2,灵物:2,羁绊:2},
    counts:{}, relics:relics, tasks:tasks,
    beings:{}, deals:0, streak:{checkin:0}, lastActionTs:{}, inventory:{}, buffs:{丰穰:0},
    achievements:[], flying:false, log:[], peTimer:0,
    combo:0, comboMax:0, refinedTotal:0, eventsDone:0, critLuck:0, storySeen:false
  };
}
let S = load();
function load(){
  try{ const r=localStorage.getItem(SAVE_KEY); if(r){ const d=JSON.parse(r); const base=defaultState();
    Object.assign(base,d);
    const relics={}; BEINGS.forEach(b=>relics[b.relic]= (d.relics&&d.relics[b.relic])||0); base.relics=relics;
    const tasks={}; TUTORIAL.forEach(t=>tasks[t.id]= (d.tasks&&d.tasks[t.id])||false); base.tasks=tasks;
    BEINGS.forEach(b=>{ if(!base.beings[b.id]) base.beings[b.id]={rep:0}; });
    return base; } }catch(e){}
  const s=defaultState(); BEINGS.forEach(b=>s.beings[b.id]={rep:0}); return s;
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){ /* 存储不可用时忽略 */ } }

/* ============ 工具 ============ */
const $ = s=>document.querySelector(s);
function penalty(){ return 1 - Math.min(0.30, S.karma*0.003); }
function succPenalty(rate){ return Math.max(0.05, rate*(1 - Math.min(0.50, S.karma*0.005))); }
function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function faithBonus(){ return (1 + 0.08*(S.deityLevel-1)) * planeBonus().faithMul * planeBonus().allMul; }
function dropChance(b){ return Math.min(0.7, 0.25 + b.tier*0.08) * planeBonus().dropMul; }
function comboMul(){ return Math.min(2, 1 + S.combo*0.05); }
function toast(msg,cls){ const t=document.createElement("div"); t.className="toast "+(cls||""); t.textContent=msg; const box=$("#toast"); if(box) box.appendChild(t); setTimeout(()=>t.remove(),2600); }
function goodsTotal(){ return GOODS_ORDER.reduce((s,k)=>s+S.goods[k],0); }
function checkTasks(){
  TUTORIAL.forEach(t=>{
    if(!S.tasks[t.id] && t.prog()>=t.goal){
      S.tasks[t.id]=true;
      if(t.reward.nature) S.natureCurrency+=t.reward.nature;
      if(t.reward.energy) S.energy+=t.reward.energy;
      if(t.reward.faith){ const g=Math.round(t.reward.faith*faithBonus()); S.faithCurrent+=g;S.faithTotal+=g; }
      if(t.reward.rep) S.reputation+=t.reward.rep;
      toast("🏅 任务完成："+t.name+" · "+t.rw,"rep");
      sfx('level');
    }
  });
}
function refineOne(id){
  if((S.relics[id]||0)<=0){ toast("没有 "+RELICS[id].name,"karma"); return; }
  S.relics[id]--; const e=RELICS[id].energy; S.energy+=e; S.refinedTotal++;
  toast("炼化 "+RELICS[id].name+" → +"+e+" 能量","energy"); sfx('refine'); afterAction();
}
function refineAll(){
  let total=0; BEINGS.forEach(b=>{ const c=S.relics[b.relic]||0; if(c>0){ total+=c*RELICS[b.relic].energy; S.relics[b.relic]=0; } });
  if(total<=0){ toast("暂无可炼化的超凡物品","karma"); return; }
  S.energy+=total; S.refinedTotal++; toast("全部炼化 → +"+total+" 能量","energy"); sfx('refine'); afterAction();
}
function planeUp(){
  const p=S.plane; if(p>=10){ toast("已是位格巅峰·无敌","energy"); return; }
  const cost=PLANE_COST[p]; if(S.energy<cost){ toast("能量不足（需"+cost+"）","energy"); return; }
  S.energy-=cost; S.plane++;
  if(S.plane>=10){ S.invincible=true; toast("🌟 你已无敌！诸天万界皆臣服","disc"); }
  else toast("位格升至 Lv"+S.plane+" · "+PLANE_PERK[S.plane],"energy");
  sfx('level'); afterAction();
}

/* ============ 音效（Web Audio，首次交互后启用） ============ */
let actx=null;
function initAudio(){ if(actx) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
function sfx(type){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.connect(g); g.connect(actx.destination);
  let f=440, dur=.15, vol=.12, wave='sine';
  if(type==='serve'){ f=660; dur=.12; }
  else if(type==='crit'){ f=990; dur=.2; wave='triangle'; vol=.16; }
  else if(type==='refine'){ f=330; dur=.35; wave='sawtooth'; }
  else if(type==='level'){ f=523; dur=.3; wave='triangle'; }
  else if(type==='fail'){ f=160; dur=.25; wave='square'; }
  else if(type==='event'){ f=440; dur=.2; wave='sine'; }
  o.type=wave; o.frequency.setValueAtTime(f,now);
  if(type==='serve'||type==='crit'||type==='level') o.frequency.exponentialRampToValueAtTime(f*1.5,now+dur);
  if(type==='fail') o.frequency.exponentialRampToValueAtTime(f*0.5,now+dur);
  g.gain.setValueAtTime(vol,now); g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.start(now); o.stop(now+dur+0.02);
}

/* ============ 修行采集 ============ */
function doCult(id){
  const c=CULTS.find(x=>x.id===id); if(!c) return;
  const now=Date.now();
  if(S.lastActionTs[id] && now-S.lastActionTs[id]<30000){ toast("操作过快，请稍候","karma"); return; }
  S.lastActionTs[id]=now;
  const pb=planeBonus();
  let mult = (S.buffs.丰穰>0 ? 1.5 : 1) * pb.cultMul * pb.allMul;
  if(c.streak){ S.streak.checkin++; const v=Math.min(25,10+(S.streak.checkin-1)*3); S.natureCurrency+=Math.round(v*mult); toast("+ "+Math.round(v*mult)+" 自然","nature"); }
  if(c.good){ S.goods[c.good]+=c.n; toast("入库 "+GOODS[c.good]+c.good+"×"+c.n,"rep"); }
  if(c.nature && !c.streak){ S.natureCurrency+=Math.round(c.nature*mult); toast("+ "+Math.round(c.nature*mult)+" 自然","nature"); }
  if(c.faith){ const g=Math.round(c.faith*faithBonus()*penalty()*mult); S.faithCurrent+=g; S.faithTotal+=g; toast("+ "+g+" 信仰","faith"); }
  if(c.count){ S.counts[c.count]=(S.counts[c.count]||0)+1; }
  if(S.buffs.丰穰>0) S.buffs.丰穰--;
  if(S.plane>=3) autoRestock();
  sfx('serve'); afterAction();
}
function autoRestock(){
  GOODS_ORDER.forEach(k=>{ while(S.goods[k]<2 && S.natureCurrency>=(RESTOCK[k]||5)){ S.natureCurrency-=(RESTOCK[k]||5); S.goods[k]++; } });
}

/* ============ 接待顾客（含偏好 / 暴击 / 连击） ============ */
function serve(cust){
  const b=cust.being, req=cust.req;
  for(const r of req){ if(S.goods[r.good] < r.n){ toast("货仓缺 "+GOODS[r.good]+r.good+"×"+r.n+"（去货仓进货）","karma"); return; } }
  if(b.costFaith && S.faithCurrent < b.costFaith){ toast("信仰之力不足（需"+b.costFaith+"）","karma"); return; }
  for(const r of req){ S.goods[r.good]-=r.n; }
  const totalReq = req.reduce((s,r)=>s+r.n,0);
  const mul = (1 + 0.2*(totalReq-1)) * planeBonus().allMul * comboMul();
  const isPref = req.some(r=>r.good===b.pref);
  const succ = b.succ ? (Math.random() < succPenalty(b.succ)) : true;
  if(succ){
    if(b.costFaith) S.faithCurrent-=b.costFaith;
    let gotFaith=0, gotNature=0;
    if(b.payFaith){ gotFaith=b.payFaith; }
    if(b.payFaithGamble){ if(Math.random()<0.5){ const g=Math.round(S.faithCurrent*rand(3,10)); gotFaith=g; } else { S.faithCurrent=0; gotFaith=-1; } }
    if(b.payNature) gotNature=b.payNature;
    const crit = Math.random() < (0.15 + (S.critLuck||0));
    if(gotFaith>0) gotFaith=Math.round(gotFaith*faithBonus()*mul*(isPref?1.3:1)*(crit?2:1));
    if(gotNature>0) gotNature=Math.round(gotNature*mul*(isPref?1.3:1)*(crit?2:1));
    if(gotFaith>0){ S.faithCurrent+=gotFaith; S.faithTotal+=gotFaith; }
    if(gotNature>0){ S.natureCurrency+=gotNature; }
    if(b.boon==="丰穰"){ S.buffs.丰穰=3; }
    if(b.boon==="阴德护符"){ S.karma=0; S.inventory.阴德护符=(S.inventory.阴德护符||0)+1; }
    if(b.boon==="神谕·良缘"){ S.log.push("神谕·良缘"); }
    if(b.boon==="飞升"){ S.flying=true; }
    S.beings[b.id].rep=Math.min(100,S.beings[b.id].rep+10+(isPref?2:0));
    S.reputation+=2; S.deals++;
    if(S.critLuck>0) S.critLuck=0;
    // 连击
    S.combo++; if(S.combo>S.comboMax) S.comboMax=S.combo;
    if(Math.random() < dropChance(b)){
      S.relics[b.relic]=(S.relics[b.relic]||0)+1;
      if(!S.discovered){ S.discovered=true; toast("✨你发现：超凡物品竟能炼化成无所不能的能量！","disc"); }
      else toast("获得超凡物品 "+RELICS[b.relic].name+RELICS[b.relic].icon,"energy");
    }
    let msg=""; if(gotFaith>0) msg+="+"+gotFaith+" 信仰 "; if(gotNature>0) msg+="+"+gotNature+" 自然 ";
    if(isPref) msg+="·偏爱! "; if(b.boon) msg+="· "+b.boon; if(gotFaith===-1) msg="破财！信仰清零";
    cust.state="happy"; cust.el.classList.remove("wait"); cust.el.classList.add("happy");
    const bub=cust.el.querySelector(".bubble"); if(bub) bub.textContent="💗";
    if(crit && gotFaith>0){ floatText(cust,"暴击! "+msg,"crit"); sfx('crit'); } else { floatText(cust,msg,"faith"); sfx('serve'); }
    burstParticles(cust, crit?"#ffb84d":"#ffe08a");
    if(girlEl){ girlEl.classList.remove("nod"); void girlEl.offsetWidth; girlEl.classList.add("nod"); }
    setTimeout(()=>removeCust(cust),950);
  } else {
    S.beings[b.id].rep=Math.max(0,S.beings[b.id].rep+(b.fail.imp||0));
    S.reputation=Math.max(0,S.reputation-2); S.combo=0;
    if(b.fail.karma) S.karma=Math.min(100,S.karma+(b.fail.karma||0));
    cust.state="sad"; cust.el.classList.remove("wait"); cust.el.classList.add("sad");
    let msg="契约失败"; if(b.fail.consume) msg+="·货品损毁"; if(b.fail.karma) msg+="·业障+"+b.fail.karma;
    floatText(cust,msg,"karma"); sfx('fail');
    setTimeout(()=>removeCust(cust),950);
  }
  checkTasks(); afterAction();
}

const SHOP_COST=[0,200,500,1200,3000];
const DEITY_COST=[0,200,500,1200,3000,6000];
function shopUp(){
  const lv=S.shop.level; if(lv>=5){ toast("店铺已满级","faith"); return; }
  const cost=SHOP_COST[lv]; if(S.natureCurrency<cost){ toast("自然货币不足（需"+cost+"）","nature"); return; }
  S.natureCurrency-=cost; S.shop.level++; toast("店铺升至 Lv"+S.shop.level,"faith"); sfx('level'); afterAction();
}
function deityUp(){
  const lv=S.deityLevel; if(lv>=6){ toast("神格已满级","faith"); return; }
  const cost=DEITY_COST[lv]; if(S.faithCurrent<cost){ toast("信仰之力不足（需"+cost+"）","faith"); return; }
  S.faithCurrent-=cost; S.deityLevel++; toast("神格升至 Lv"+S.deityLevel+"（产出+8%）","faith"); sfx('level'); afterAction();
}

/* ============ 动态店铺 DOM 运行时 ============ */
let stage=null, custLayer=null, floatLayer=null, orbEl=null, girlEl=null;
let customers=[], spawnTimer=0, shopRunning=false, lastT=0, clock=0, eventTimer=0, stageW=480, eventActive=false;
function setupShop(){
  stage=$("#shopStage"); if(!stage){ showErr('找不到 #shopStage'); return; }
  custLayer=$("#custLayer"); floatLayer=$("#floatLayer"); orbEl=$("#energyOrb"); girlEl=$("#shopGirl");
  stageW=Math.max(280, stage.clientWidth||480);
  decorateStage();
  if(girlEl) girlEl.classList.toggle("girl-aura", S.plane>=3);
  updateOrb(); updateShopTop();
}
function decorateStage(){
  if(!stage||stage.dataset.decorated) return; stage.dataset.decorated="1";
  const sf=document.getElementById('starfield');
  if(sf){ for(let i=0;i<26;i++){ const s=document.createElement('i'); s.className='s';
    s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*55)+'%';
    s.style.animationDelay=(Math.random()*3)+'s'; s.style.opacity=(0.3+Math.random()*0.7).toFixed(2);
    sf.appendChild(s); } }
  const cols=['#ffd86b','#ff9ecf','#b07bff'];
  for(let i=0;i<9;i++){ const p=document.createElement('i'); p.className='spark';
    p.style.left=(6+Math.random()*88)+'%'; p.style.bottom=(10+Math.random()*40)+'%';
    p.style.animationDuration=(4+Math.random()*5)+'s'; p.style.animationDelay=(Math.random()*4)+'s';
    p.style.color=cols[i%3]; stage.appendChild(p); }
}
function updateOrb(){
  if(!orbEl) return;
  const eNorm=Math.min(1, S.energy/2700), r=14+eNorm*22, warm=eNorm>=0.5;
  orbEl.style.width=(r*2)+"px"; orbEl.style.height=(r*2)+"px";
  orbEl.style.right=(48-r)+"px"; orbEl.style.bottom=(110-r)+"px";
  orbEl.style.background = warm? "radial-gradient(circle at 40% 40%,#fff3c4,#ffcd5a)" : "radial-gradient(circle at 40% 40%,#f0e0ff,#b07bff)";
  orbEl.style.boxShadow = warm? "0 0 26px 8px rgba(255,205,90,0.55)":"0 0 26px 8px rgba(176,123,255,0.55)";
}
function updateShopTop(){
  const t=$("#shopTop"); if(!t) return;
  let comboHtml = S.combo>1? `<div class="combo">🔥连击 ×${S.combo}（收益+${Math.round((comboMul()-1)*100)}%）</div>` : "";
  t.innerHTML=`<div class="t1">万法商铺 Lv${S.shop.level}</div>
    ${comboHtml}
    <div>${S.karma>0?("☣业障 "+Math.round(S.karma)):"✿ 营业中"}</div>
    <div style="color:#c79bff">🔮能量 ${Math.round(S.energy)} · 位格${S.plane}</div>`;
}
function maxCust(){ return Math.min(6, S.shop.level+1); }
function patienceMax(urgent){ return (urgent?14000:(45+S.shop.level*5)*1000); }
function spawnInterval(){ let base=Math.max(2500, 7000 - S.shop.level*900); if(planeBonus().attractHigh) base*=0.8; return base; }
function slotX(i,n){ if(n<=1) return stageW/2; const pad=120, span=Math.max(40,stageW-pad*2); return pad+span*i/(n-1); }
function freeSlot(){
  const n=maxCust(), used=new Set(customers.filter(c=>(c.state==="enter"||c.state==="wait")).map(c=>c.slot));
  for(let i=0;i<n;i++) if(!used.has(i)) return i; return -1;
}
function trySpawn(){
  if(eventActive) return;
  if(customers.filter(c=>(c.state==="enter"||c.state==="wait")).length>=maxCust()) return;
  let pool=BEINGS.filter(b=>beingUnlocked(b,S)); if(!pool.length) return;
  let b;
  if(planeBonus().attractHigh){ const hi=pool.filter(x=>x.tier>=3); b=(hi.length&&Math.random()<0.6)?hi[rand(0,hi.length-1)]:pool[rand(0,pool.length-1)]; }
  else b=pool[rand(0,pool.length-1)];
  const slot=freeSlot(); if(slot<0) return;
  const tx=slotX(slot,maxCust()), req=genReq(b), voice=VOICES[b.id][rand(0,VOICES[b.id].length-1)];
  // 急单：tier>=2 时 12% 概率
  const urgent = b.tier>=2 && Math.random()<0.12;
  const col = b.tier>=4?"#fff0a0":(b.tier>=3?"#ffcf4d":(b.tier>=2?"#9be0c8":"#ffd0e6"));
  const el=document.createElement("div"); el.className="customer"+(urgent?" urgentc":"");
  el.style.setProperty("--cc",col);
  el.style.setProperty("--tx",(stageW+80)+"px");
  const reqTxt=req.map(r=>GOODS[r.good]+"×"+r.n).join(" ");
  let ret=""; if(b.payFaith||b.payFaithGamble) ret+="✦"; if(b.payNature) ret+="❀"; if(b.boon) ret+="·"+b.boon;
  const prefHtml=`<div class="pref">偏爱 ${GOODS[b.pref]||b.pref}</div>`;
  const urgentHtml=urgent?`<div class="urgent">⚡急单 · 高价</div>`:"";
  el.innerHTML=`<div class="bubble">${reqTxt} <b style="color:#9a7400">${ret}</b></div>
    ${prefHtml}${urgentHtml}
    <div class="voice">${voice}</div>
    <div class="ring"><svg viewBox="0 0 60 60"><circle class="bg" cx="30" cy="30" r="26"></circle><circle class="fg" cx="30" cy="30" r="26"></circle></svg></div>
    <div class="body"></div><div class="face">${b.icon}</div><div class="plate">${b.name}</div>`;
  if(custLayer) custLayer.appendChild(el);
  const circ=el.querySelector(".ring .fg");
  const C=2*Math.PI*26;
  if(circ){ circ.style.strokeDasharray=C; circ.style.strokeDashoffset=0; }
  const cust={el,being:b,req,state:"enter",slot,patience:patienceMax(urgent),maxPatience:patienceMax(urgent),tx,wait:0,auto:0,urgent};
  customers.push(cust);
  requestAnimationFrame(()=>{ if(el&&el.isConnected){ el.style.setProperty("--tx",tx+"px"); } });
  el.addEventListener("click",()=>{ if(cust.state==="wait") serve(cust); });
}
function removeCust(c){ if(c.el&&c.el.parentNode) c.el.remove(); customers=customers.filter(x=>x!==c); }
function floatText(cust,text,cls){
  if(!floatLayer) return;
  const el=document.createElement("div"); el.className="float"+(cls==="crit"?" crit":""); el.textContent=text;
  el.style.color = cls==="karma"?"#ff8a8a":(cls==="nature"?"#7fe6c8":(cls==="energy"?"#d9c2ff":"#ffe08a"));
  const tx=(parseFloat(cust.el.style.getPropertyValue("--tx"))||cust.tx||stageW/2);
  el.style.left=(tx-16)+"px"; el.style.bottom="120px";
  floatLayer.appendChild(el); setTimeout(()=>el.remove(),1400);
}
function burstParticles(cust,color){
  if(!floatLayer) return;
  const tx=(parseFloat(cust.el.style.getPropertyValue("--tx"))||cust.tx||stageW/2);
  for(let i=0;i<8;i++){
    const p=document.createElement("div"); p.className="particle"; p.style.background=color;
    p.style.left=(tx+ (Math.random()*40-20))+"px"; p.style.bottom="120px";
    const ang=Math.random()*Math.PI*2, dist=30+Math.random()*40;
    p.style.setProperty("--px",(Math.cos(ang)*dist).toFixed(0)+"px");
    p.style.setProperty("--py",(Math.sin(ang)*dist-20).toFixed(0)+"px");
    floatLayer.appendChild(p); setTimeout(()=>p.remove(),700);
  }
}
function triggerEvent(){
  if(eventActive) return;
  const ev=EVENTS[rand(0,EVENTS.length-1)];
  eventActive=true;
  const modal=$("#eventModal"); if(!modal){ eventActive=false; return; }
  $("#evIcon").textContent=ev.icon; $("#evTitle").textContent=ev.title; $("#evDesc").textContent=ev.desc;
  const box=$("#evChoices"); box.innerHTML="";
  ev.choices.forEach((ch,idx)=>{
    const btn=document.createElement("button"); btn.className="ev-choice";
    btn.innerHTML=ch.label+`<span class="ce">${ch.ce}</span>`;
    btn.onclick=()=>{ const res=ch.effect(); S.eventsDone++; eventActive=false; modal.style.display="none"; toast(res,"disc"); sfx('event'); checkTasks(); afterAction(); };
    box.appendChild(btn);
  });
  modal.style.display="flex"; sfx('event');
}
function tick(dt){
  clock+=dt;
  if(!eventActive){
    eventTimer-=dt; if(eventTimer<=0){ eventTimer=55000+Math.random()*45000; triggerEvent(); }
  }
  const pb=planeBonus();
  if(pb.passiveEnergy){ S.peTimer=(S.peTimer||0)+dt; const rate=pb.invincible?900:3000; if(S.peTimer>=rate){ S.peTimer=0; const a=pb.invincible?3:1; S.energy+=a; updateOrb(); if(Math.random()<0.3) toast("能量共鸣 +"+a,"energy"); } }
  if(!eventActive){
    spawnTimer-=dt; if(spawnTimer<=0){ spawnTimer=spawnInterval(); trySpawn(); }
  }
  for(const c of customers){
    if(c.state==="enter"){ c.wait+=dt; if(c.wait>=1100){ c.state="wait"; c.el.classList.add("wait"); } }
    else if(c.state==="wait"){
      const can=c.req.every(r=>S.goods[r.good]>=r.n);
      if(pb.autoServe && can){ c.auto+=dt; if(c.auto>=1200){ serve(c); continue; } }
      c.patience-=dt; const pr=Math.max(0,c.patience/c.maxPatience);
      const circ=c.el.querySelector(".ring .fg"); if(circ){ const C=2*Math.PI*26; circ.style.strokeDashoffset=(C*(1-pr)).toFixed(1); }
      if(c.patience<=0){ c.state="sad"; c.el.classList.remove("wait"); c.el.classList.add("sad"); if(can) S.reputation=Math.max(0,S.reputation-1); S.combo=0; afterAction(); setTimeout(()=>removeCust(c),950); }
    }
  }
}
function loop(t){
  if(!shopRunning) return;
  if(!lastT) lastT=t; let dt=t-lastT; lastT=t; if(dt>100) dt=100;
  try{ tick(dt); }catch(e){ /* 单帧异常不终止主循环 */ }
  requestAnimationFrame(loop);
}
function startShop(){
  if(!stage) setupShop();
  customers.forEach(c=>c.el&&c.el.remove()); customers=[];
  shopRunning=true; lastT=0; spawnTimer=400; eventTimer=55000+Math.random()*45000;
  if(girlEl) girlEl.classList.toggle("girl-aura", S.plane>=3);
  updateOrb(); updateShopTop();
  trySpawn(); trySpawn(); trySpawn();
  requestAnimationFrame(loop);
}

/* ============ 交互 ============ */
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{
  TAB=b.dataset.tab; document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("active")); b.classList.add("active");
  if(TAB!=="shop"){ shopRunning=false; }
  initAudio(); render();
});
document.querySelectorAll("#shopStage .shop-girl"); // 少女引用在 setupShop 内

/* ============ 启动（开场 splash → 序章剧情 → 点「开始营业」进店） ============ */
window.addEventListener('resize',()=>{ if(TAB==="shop"&&shopRunning&&stage){ stageW=Math.max(280,stage.clientWidth||480); customers.forEach(c=>{ if(c.state==="wait"){ c.tx=slotX(c.slot,maxCust()); c.el.style.setProperty("--tx",c.tx+"px"); } }); } });
const _splash=document.getElementById('splash'), _startBtn=document.getElementById('startBtn');
const _story=document.getElementById('story'), _storyNext=document.getElementById('storyNext'), _storyText=document.getElementById('storyText');
const STORY_PAGES=[
  "「万法商铺」开张第七日。少女店主守着这间诸天位面商城，卖些人间的平凡货品，换些零碎的信仰与自然货币。",
  "直到那日——一位土地公成交后，竟留下一枚温润的「神土」。她随手将它投入炼化炉，炉火骤亮，化出一缕<b>无所不能的能量</b>。",
  "原来诸天生物的馈赠，皆可炼为能量。而能量，能让她一阶一阶，走向<b>无敌</b>。\n\n于是她决定：开张迎客，收集能量，直到诸天万界皆来臣服。",
];
let _storyIdx=0;
function showStory(){
  if(S.storySeen){ boot(); return; }
  _splash.classList.add('bye'); setTimeout(()=>{ if(_splash.parentNode) _splash.remove(); },520);
  _story.style.display="flex"; _storyIdx=0; _storyText.innerHTML=STORY_PAGES[0];
}
function boot(){ try{ render(); }catch(e){ showErr(e.message); } }
if(_splash&&_startBtn){
  _startBtn.addEventListener('click',()=>{ initAudio(); showStory(); });
  _storyNext.addEventListener('click',()=>{
    _storyIdx++;
    if(_storyIdx>=STORY_PAGES.length){ S.storySeen=true; save(); _story.classList.add('bye'); setTimeout(()=>{ if(_story.parentNode) _story.remove(); },520); boot(); }
    else { _storyText.innerHTML=STORY_PAGES[_storyIdx]; if(_storyIdx===STORY_PAGES.length-1) _storyNext.textContent="开始营业"; }
  });
}else{
  boot();
}
</script>
</body>
</html>
