<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>信仰交易录 · 万法商铺 (v4.0 位面商城建造时代)</title>
<style>
  :root{
    --faith:#f4c542; --nature:#4ec9a8; --energy:#b07bff; --karma:#e05a5a; --rep:#c98be0;
    --bg1:#fbe9f3; --bg2:#e9e4fb; --card:#ffffffee; --ink:#4a3b55;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}
  #app{max-width:540px;margin:0 auto;padding:10px 12px 104px}
  header{position:sticky;top:0;z-index:5;background:rgba(42,26,60,.55);
    backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:16px;
    padding:10px 12px;box-shadow:0 6px 22px #160a2e66;margin-bottom:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .stat{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;flex:1}
  .pill{border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#f2e9ff;box-shadow:0 1px 4px #0004;white-space:nowrap}
  .pill.faith{color:#ffdf80;border-color:#f4c54288}
  .pill.nature{color:#7fe6c8;border-color:#4ec9a888}
  .pill.energy{color:#d9c2ff;border-color:#b07bff88}
  .pill.karma{color:#ff9a9a;border-color:#e05a5a88}
  .pill.rep{color:#e0bcff;border-color:#c98be088}
  .pill.shop{color:#cbb6ff;border-color:#9b7be088}
  .pill.combo{color:#ffb877;border-color:#ff9a4d99;font-weight:700}
  .pill.hot{color:#ffb877;border-color:#ff9a4dcc;font-weight:700}
  header .muted{color:#cdbbe6}
  .gear{border:0;background:rgba(255,255,255,.12);color:#e7d4ff;width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;flex:0 0 auto;box-shadow:0 2px 6px #0004;transition:transform .2s;align-self:flex-start}
  .gear:active{transform:rotate(45deg)}
  nav{display:flex;gap:4px;position:fixed;bottom:0;left:0;right:0;max-width:540px;margin:0 auto;
    background:#fff8;backdrop-filter:blur(8px);padding:8px;border-top:1px solid #fff;z-index:6}
  nav button{flex:1;border:0;background:#fff;border-radius:11px;padding:8px 1px;font-size:11px;color:var(--ink);
    box-shadow:0 2px 6px #0001;cursor:pointer}
  nav button.active{background:linear-gradient(160deg,#ffd9ee,#d9ccff);font-weight:700}
  .card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 3px 12px #cdb6e044}
  .card h3{margin:0 0 8px;font-size:15px}
  button.act{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:0;border-radius:12px;
    background:#fff;box-shadow:0 2px 6px #0001;cursor:pointer;font-size:14px;color:var(--ink)}
  button.act:active{transform:scale(.98)}
  button.act .sub{display:block;font-size:11px;color:#9a8aa5;margin-top:2px}
  button.mini{border:0;background:#f6efff;color:#6a4bb0;border-radius:9px;padding:5px 10px;font-size:12px;cursor:pointer;box-shadow:0 2px 5px #0001}
  button.mini.on{background:linear-gradient(160deg,#ffd9ee,#d9ccff);color:#4a2a6b;font-weight:700}
  .tag{display:inline-block;font-size:11px;border-radius:8px;padding:1px 7px;margin-right:4px}
  .t-faith{background:#f4c54222;color:#9a7400}
  .t-nature{background:#4ec9a822;color:#1f7a63}
  .t-energy{background:#b07bff22;color:#5a2da0}
  .t-goods{background:#c98be022;color:#7a3fa0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .merit{aspect-ratio:1;border-radius:12px;background:linear-gradient(160deg,#fff,#f3ecff);display:flex;
    flex-direction:column;align-items:center;justify-content:center;font-size:12px;text-align:center;box-shadow:0 2px 6px #0001}
  .merit .e{font-size:26px}
  .merit .c{font-weight:700;color:#7a3fa0}
  .bar{height:8px;border-radius:999px;background:#eee;overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff9ecf,#9b7be0)}
  .bar>i.energy{background:linear-gradient(90deg,#c79bff,#7b4bd0)}
  #toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  .toast{background:#4a3b55ee;color:#fff;padding:7px 14px;border-radius:999px;font-size:13px;animation:pop .3s ease, fade 2.6s forwards}
  .toast.faith{background:#9a7400ee}.toast.nature{background:#1f7a63ee}.toast.energy{background:#5a2da0ee}
  .toast.karma{background:#a33232ee}.toast.rep{background:#7a3fa0ee}.toast.disc{background:#b07bffee}
  .toast.crit{background:#e07b1fee;font-weight:800;font-size:15px}
  .toast.hot{background:#e08a1fee}
  @keyframes pop{from{transform:translateY(-8px) scale(.9);opacity:0}to{transform:none;opacity:1}}
  @keyframes fade{0%,70%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
  .muted{color:#9a8aa5;font-size:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .being{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #0001}
  .being .ic{font-size:22px;width:44px;height:44px;flex:0 0 44px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f3e9ff,#e4d4ff);border:1.5px solid #d9c7f5;box-shadow:0 2px 7px #6a3f9e26}
  .being .ic img{width:100%;height:100%;object-fit:cover;display:block}
  .being .ic.lock{color:#b9a8d6;background:#efe8fb;border-style:dashed}
  .being .nm{font-size:13px;font-weight:600}
  .small{font-size:12px}
  .ach{display:inline-block;background:#ffe6f4;color:#a3447f;border-radius:8px;padding:3px 8px;margin:3px;font-size:12px}
  .relic{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #0001}
  .relic .ic{font-size:24px;width:30px;text-align:center}
  .relic .nm{font-weight:600;font-size:13px}
  .perk{font-size:12px;padding:4px 0;color:#5a2da0}
  .perk.off{color:#bbaac9}
  #err{position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#a33232;color:#fff;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5;white-space:pre-wrap;box-shadow:0 4px 14px #0006}
  .helper{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #0001;font-size:13px}
  .helper .hn{font-weight:600;width:44px}
  .helper select{flex:1;border:1px solid #cdb6e0;border-radius:8px;padding:4px 6px;font-size:12px;color:var(--ink);background:#fff}

  /* ===== 诸天杂货店（跨界倒卖线 · 双线并列） ===== */
  .pill.coin{color:#ffe08a;border-color:#ffcf4d88}
  .cust-board{margin-top:8px;background:linear-gradient(160deg,#fff,#f3ecff);box-shadow:0 2px 8px #0001;border-radius:12px;padding:10px;min-height:64px;display:flex;align-items:center}
  .cust-board .cust{display:flex;gap:10px;align-items:center;animation:slideIn .4s ease;width:100%}
  @keyframes slideIn{from{transform:translateX(-16px);opacity:0}to{transform:none;opacity:1}}
  .cust .face{font-size:32px;width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f3e9ff,#e4d4ff);border:1.5px solid #d9c7f5;flex:0 0 52px}
  .cust .say{font-size:13px;flex:1}
  .cust .say b{color:#7a3fa0}
  .real-good{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #0001}
  .real-good .ic{font-size:24px;width:46px;height:46px;flex:0 0 46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f3e9ff,#e4d4ff);border:1.5px solid #d9c7f5}
  .real-good .nm{font-size:14px;font-weight:600}
  .real-good .meta{font-size:11px;color:#9a8aa5}
  .price-edit{display:flex;gap:4px;align-items:center}
  .price-edit button{border:0;background:#f6efff;color:#6a4bb0;border-radius:8px;width:26px;height:26px;font-size:16px;line-height:1;cursor:pointer;box-shadow:0 2px 5px #0001}
  .price-edit .pv{min-width:46px;text-align:center;font-weight:700;color:#7a3fa0}
  .note{font-size:12px;padding:6px 8px;border-radius:10px;background:#fff3e6;border:1px solid #ffd9ee;margin:4px 0}
  .deal-log{font-size:12px;color:#6a4bb0;padding:3px 0;border-bottom:1px dashed #0001}
  .tag.cat{background:#b07bff22;color:#5a2da0}
  .empty-hint{color:#9a8aa5;font-size:12px;text-align:center;padding:14px}

  /* ===== 动态店铺 DOM 版（不依赖 canvas） ===== */
  #shopWrap{position:relative;padding:0;overflow:hidden;border-radius:16px}
  .shop-stage{position:relative;width:100%;height:400px;overflow:hidden;border-radius:16px;
    background:url('assets/scene.webp') center 30%/cover no-repeat,#241a33;
    box-shadow:0 4px 18px #cdb6e055}
  .shop-stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:linear-gradient(180deg,rgba(46,22,78,.40) 0%,rgba(22,12,40,.16) 42%,rgba(12,7,24,.74) 100%)}
  .shop-stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:16px;
    box-shadow:inset 0 0 130px rgba(0,0,0,0.55)}
  .shop-window{position:absolute;right:18px;top:16px;width:140px;height:100px;border-radius:14px;overflow:hidden;z-index:2;
    background:linear-gradient(180deg,#2a2350,#0e0a22);border:3px solid #6a5590;box-shadow:0 0 30px rgba(120,90,200,0.25)}
  .shop-window .moon{position:absolute;right:18px;top:16px;width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 40% 40%,#fff7d6,#ffe9a8);box-shadow:0 0 18px #fff7d655}
  .shop-window .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 2s infinite ease-in-out}
  @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
  .lantern{position:absolute;top:28px;width:20px;height:26px;border-radius:50%;background:#ff6b6b;z-index:2;
    box-shadow:0 0 26px 10px rgba(255,190,120,0.4);animation:sway 3s ease-in-out infinite;transform-origin:top center}
  .lantern::before{content:"";position:absolute;left:50%;top:-12px;width:2px;height:14px;background:#7a5a3a;transform:translateX(-50%)}
  .lantern::after{content:"";position:absolute;left:50%;bottom:-12px;width:2px;height:12px;background:#ffcf4d;transform:translateX(-50%)}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .floor{position:absolute;left:0;right:0;bottom:0;height:74px;z-index:1;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,0.12) 0 1px,transparent 1px 24px),linear-gradient(180deg,#7a4f3a,#4a2f24)}
  .counter{position:absolute;left:0;right:0;bottom:0;height:62px;z-index:6;border-top:3px solid #caa06a;
    background-image:repeating-linear-gradient(90deg,rgba(0,0,0,0.12) 0 1px,transparent 1px 24px),linear-gradient(180deg,#9a6440,#5b3a29)}
  .jar{position:absolute;width:14px;height:14px;border-radius:50%;background:currentColor;z-index:2;box-shadow:0 0 16px 4px currentColor}
  .furnace{position:absolute;right:18px;bottom:70px;width:40px;height:54px;border-radius:10px;z-index:2;background:#3a2a4a;border:2px solid #5a4a7d;box-shadow:inset 0 4px 8px #0006}
  .energy-orb{position:absolute;width:28px;height:28px;border-radius:50%;z-index:2;
    background:radial-gradient(circle at 40% 40%,#f0e0ff,#b07bff);
    box-shadow:0 0 26px 8px rgba(176,123,255,0.55);transition:all .4s ease;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .shop-girl{position:absolute;left:-28px;bottom:16px;width:158px;height:auto;z-index:4;pointer-events:none;
    filter:drop-shadow(0 0 22px rgba(176,123,255,.55));animation:breathe 3.4s ease-in-out infinite;
    -webkit-mask-image:radial-gradient(ellipse 60% 74% at 50% 50%,#000 58%,rgba(0,0,0,.7) 76%,transparent 93%);
    mask-image:radial-gradient(ellipse 60% 74% at 50% 50%,#000 58%,rgba(0,0,0,.7) 76%,transparent 93%)}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .shop-window,.lantern,.jar,.furnace,.floor,.counter{display:none!important}
  .shop-girl.nod{animation:nod .5s ease}
  @keyframes nod{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(2px) rotate(3deg)}}
  .shop-girl .eye{transform-origin:center;animation:blink 4.6s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
  .girl-aura{filter:drop-shadow(0 0 12px rgba(176,123,255,0.7))}
  /* 商城地块 */
  .plot-band{position:absolute;left:136px;right:8px;top:28px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;z-index:3}
  .plot{position:relative;height:56px;border-radius:10px;background:rgba(255,255,255,0.13);box-shadow:0 4px 12px #0003;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:#f2e9ff;text-align:center;
    line-height:1.25;padding:2px;border:1px solid rgba(255,255,255,0.24);backdrop-filter:blur(6px);text-shadow:0 1px 2px #0008;cursor:pointer;overflow:hidden}
  .plot:active{transform:scale(.96)}
  .plot .pi{font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center}
  .plot .pi img{width:100%;max-width:30px;height:26px;object-fit:contain;display:block;filter:drop-shadow(0 1px 2px #0004)}
  .plot .plv{display:flex;gap:2px;margin-top:2px}
  .plot .plv i{width:4px;height:4px;border-radius:50%;background:#b07bff}
  .plot .ph{position:absolute;top:2px;left:4px;font-size:8px;background:#7a5aa8;color:#fff;border-radius:6px;padding:0 4px}
  .plot.empty{background:rgba(255,255,255,0.07);border:1.5px dashed rgba(255,255,255,0.35);color:#ffffffcc;box-shadow:none}
  .cust-layer{position:absolute;inset:0;z-index:5}
  .customer{position:absolute;bottom:70px;left:0;margin-left:-32px;width:64px;height:104px;z-index:5;
    transform:translateX(var(--tx,560px));transition:transform 1.2s cubic-bezier(.25,.9,.3,1),opacity .6s;cursor:pointer}
  .customer .body{display:none}
  .customer .face{position:absolute;left:50%;top:17px;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;background:radial-gradient(circle at 50% 35%,#2a1b45,#120a20);border:2px solid var(--cc,#ffd0e6);box-shadow:0 0 14px 1px var(--cc,#ffd0e6),0 3px 8px #0007}
  .customer .face img{width:100%;height:100%;object-fit:cover;display:block}
  .customer .plate{position:absolute;left:50%;top:74px;transform:translateX(-50%);white-space:nowrap;
    background:rgba(0,0,0,0.52);color:#fff;font-size:11px;padding:1px 7px;border-radius:8px;box-shadow:0 2px 5px #0005}
  .customer .bubble{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;
    background:#ffffffe8;color:#4a3b55;font-size:13px;padding:3px 8px;border-radius:9px;box-shadow:0 2px 6px #0002;font-weight:600}
  .customer .pref{position:absolute;left:50%;top:-52px;transform:translateX(-50%);white-space:nowrap;
    background:#fff4d6;color:#9a7400;font-size:10px;padding:1px 6px;border-radius:7px;border:1px solid #f4c54266}
  .customer .loyal{position:absolute;left:50%;top:-52px;transform:translateX(-50%);white-space:nowrap;
    background:#e6d6ff;color:#5a2da0;font-size:10px;padding:1px 6px;border-radius:7px;border:1px solid #b07bff66}
  .customer .voice{position:absolute;left:50%;top:-72px;transform:translateX(-50%);white-space:nowrap;max-width:170px;
    background:rgba(123,75,160,0.92);color:#fff;font-size:10px;padding:2px 6px;border-radius:8px}
  .customer .urgent{position:absolute;left:50%;top:-92px;transform:translateX(-50%);white-space:nowrap;
    background:#ff6b3d;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;animation:flash .8s infinite}
  .customer .big{position:absolute;left:50%;top:-92px;transform:translateX(-50%);white-space:nowrap;
    background:#3d7bff;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;animation:flash .8s infinite}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:.5}}
  .customer .ring{position:absolute;left:-3px;top:9px;width:70px;height:70px;z-index:-1}
  .customer .ring circle{fill:none;stroke-width:4;stroke-linecap:round}
  .customer .ring .bg{stroke:rgba(0,0,0,0.3)}
  .customer .ring .fg{stroke:#4ec9a8;transition:stroke-dashoffset .1s linear}
  .customer.urgentc .ring .fg{stroke:#ff8a4d}
  .customer.bigc .ring .fg{stroke:#6ba6ff}
  .customer.happy{transform:translateX(-260px)!important;opacity:0;transition:transform .9s ease-in,opacity .9s}
  .customer.sad{transform:translateX(660px)!important;opacity:0;transition:transform .9s ease-in,opacity .9s}
  .float-layer{position:absolute;inset:0;pointer-events:none;z-index:8}
  .float{position:absolute;font-weight:700;font-size:15px;text-shadow:0 1px 3px #0009;animation:floatUp 1.4s ease-out forwards}
  .float.crit{font-size:22px;color:#ffb84d!important;text-shadow:0 0 8px #ff7a1f,0 1px 3px #0009}
  @keyframes floatUp{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-46px) scale(1.1)}}
  .particle{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:9;
    animation:burst .7s ease-out forwards}
  @keyframes burst{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--px),var(--py)) scale(.3)}}
  .shop-top{position:relative;margin:0 0 10px;padding:9px 13px;color:#fff;font-size:12px;line-height:1.55;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.17);border-radius:14px;
    backdrop-filter:blur(10px);box-shadow:0 6px 18px #0003;text-shadow:0 1px 2px #0008;pointer-events:none;z-index:7}
  .shop-top .t1{font-size:15px;font-weight:700}
  .shop-top .combo{color:#ffb84d;font-weight:800}
  .shop-top .hot{color:#ffb84d;font-weight:700;background:rgba(255,154,77,.20);padding:2px 8px;border-radius:8px;display:inline-block;box-shadow:0 1px 6px #0004}
  .shop-top .guide{margin-top:6px;font-size:12px;color:#ffd9a0;font-weight:600;text-shadow:0 1px 4px #0007;background:rgba(176,123,255,.16);padding:4px 10px;border-radius:9px;display:inline-block;box-shadow:0 1px 6px #0003}
  .shop-top .guide.done{color:#9be0c8;background:rgba(120,224,160,.14)}
  @media (max-width:600px){
    #app{padding:8px 8px 92px}
    nav button{font-size:13px;padding:9px 4px;min-height:50px;border-radius:12px}
    .card{padding:12px 12px 14px}
    header{padding:8px 10px}
    .stat{gap:5px}
    .pill{font-size:11px;padding:3px 7px}
    .shop-stage{height:340px}
    .shop-top{font-size:12px;line-height:1.5}
    .customer .voice{font-size:10px;max-width:140px}
    .gear{width:34px;height:34px;font-size:16px}
    #eventModal .ev-card,#plotModal .ev-card,#settingsModal .set-card{padding:16px 13px}
  }
  @media (max-width:380px){
    nav button{font-size:12px;padding:8px 2px;min-height:46px}
    .pill{font-size:10px;padding:2px 6px}
    .shop-stage{height:300px}
  }

  /* 矢量氛围：星云 / 视差星空 / 上升光尘 */
  .nebula{position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(240px 140px at 78% 12%,rgba(176,123,255,.22),transparent 70%),
               radial-gradient(200px 120px at 12% 20%,rgba(255,158,207,.14),transparent 70%),
               radial-gradient(260px 160px at 50% 92%,rgba(255,205,90,.10),transparent 70%)}
  .starfield{position:absolute;inset:0;z-index:1;pointer-events:none}
  .starfield .s{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
  .spark{position:absolute;width:4px;height:4px;border-radius:50%;z-index:2;pointer-events:none;
    background:radial-gradient(circle,#ffffff88 0%,currentColor 45%,transparent 70%);
    animation:rise linear infinite;opacity:.85}
  @keyframes rise{from{transform:translateY(0);opacity:.9}70%{opacity:.7}to{transform:translateY(-180px);opacity:0}}

function genReq(b){
  let nItems = b.tier<=1 ? 1 : (Math.random()<0.5?1:2);
  const req=[]; const used=new Set();
  for(let i=0;i<nItems;i++){
    let g, tries=0;
    if(i===0 && S.hot && S.hot.good && Math.random()<0.5){ g=S.hot.good; }
    else { do{ g=GOODS_ORDER[rand(0,GOODS_ORDER.length-1)]; tries++; }while(used.has(g)&&tries<6); }
    used.add(g);
    req.push({good:g, n: rand(1, 2+b.tier)});
  }
  return req;
}
function beingUnlocked(b,S){
  if(b.tier===1) return true;
  if(b.tier===2) return S.shop.level>=2;
  if(b.tier===3) return S.shop.level>=3;
  if(b.tier===4) return S.shop.level>=3 && S.reputation>=30;
  return false;
}

// 隐藏估值倍率：匹配偏好类→高价(8~26倍)，否则低价(1~2倍)。基于(world,good)确定性，玩家靠交易发现
function valuationOf(worldId, goodId){
  const g=REAL_GOODS.find(x=>x.id===goodId); if(!g) return 1;
  const w=REAL_WORLDS[worldId]; if(!w) return 1;
  let h=0; const s=worldId+goodId; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  const r=(h%100)/100;
  if(g.cat===w.pref) return 8 + Math.round(r*18);   // 8~26 倍
  return 1 + (r<0.5?0:1);                            // 1~2 倍
}

function assignHelperToPlot(v, plotIdx){
  if(!S.plots[plotIdx]){ return; }
  const hid = v===""?null:parseInt(v,10);

    const h=S.helpers.find(x=>x.id===hid);
    if(!h){ return; }
    if(h.plot!=null && S.plots[h.plot]) S.plots[h.plot].help=null;
    h.plot=plotIdx;
  } else {
    const cur=S.helpers.find(x=>x.plot===plotIdx);
    if(cur) cur.plot=null;
  }
  S.plots[plotIdx].help=hid;
  checkTasks(); afterAction();
}

/* ============ 状态 ============ */

  const relics={}; BEINGS.forEach(b=>relics[b.relic]=0);
  const tasks={}; TUTORIAL.forEach(t=>tasks[t.id]=false);
  return {
    faithTotal:0, faithCurrent:0, natureCurrency:220, energy:0, karma:0, coin:200,
    deityLevel:1, shop:{level:1}, reputation:0, plane:1, invincible:false, discovered:false,
    goods:{食物:2,知识:2,旧物:2,观想:2,灵物:2,羁绊:2},
    counts:{}, relics:relics, tasks:tasks,
    beings:{}, deals:0, streak:{checkin:0}, lastActionTs:{}, inventory:{}, buffs:{丰穰:0},
    achievements:[], flying:false, log:[], peTimer:0,
    combo:0, comboMax:0, refinedTotal:0, eventsDone:0, critLuck:0, storySeen:false,
    hot:{good:"食物",t:50}, hotNext:"知识", shelfUps:0, adsUsed:0,
    plots:[
      {b:"shelf",lv:1,good:"食物",help:null},
      {b:"shelf",lv:1,good:"知识",help:null},
      {b:"shelf",lv:1,good:"旧物",help:null},
      emptyPlot(),emptyPlot(),emptyPlot()
    ],
    helpers:[{id:1,name:"小灯",plot:null},{id:2,name:"阿账",plot:null}],
    helperSeq:2, builds:0, altarT:0, restockT:{}, lastSeenTs:Date.now(),
    store:{inv:{}, price:{}, notes:[], log:[], lastTs:Date.now()}
  };
}
let S = load();
(function(){
  if(!S.store||typeof S.store!=="object") S.store={inv:{},price:{},notes:[],log:[],lastTs:Date.now()};
  S.store.inv=S.store.inv||{}; S.store.price=S.store.price||{}; S.store.notes=S.store.notes||[]; S.store.log=S.store.log||[]; S.store.lastTs=S.store.lastTs||Date.now();
  if(typeof S.coin!=="number") S.coin=200;
})();
loadSettings();
function load(){
  try{ const r=localStorage.getItem(SAVE_KEY); if(r){ const d=JSON.parse(r); const base=defaultState();
    Object.assign(base,d);
    const relics={}; BEINGS.forEach(b=>relics[b.relic]=(d.relics&&d.relics[b.relic])||0); base.relics=relics;
    const tasks={}; TUTORIAL.forEach(t=>tasks[t.id]=(d.tasks&&d.tasks[t.id])||false); base.tasks=tasks;
    BEINGS.forEach(b=>{ if(!base.beings[b.id]) base.beings[b.id]={rep:0}; });
    // —— 旧档迁移：v30 货架槽 → v40 商城地块 ——
    if(!Array.isArray(base.plots)||base.plots.length<6){
      const old=(Array.isArray(d.shelves)&&d.shelves.length)?d.shelves:defaultState().shelves||[];
      const plots=[];
      for(let i=0;i<6;i++){ const s=old[i]; plots.push(s&&s.good?{b:"shelf",lv:s.level||1,good:s.good,help:null}:emptyPlot()); }
      base.plots=plots;
    }
    base.plots=base.plots.map(p=>({b:p.b||null,lv:p.lv||1,good:p.good||null,help:(p.help==null?null:p.help)}));
    if(!Array.isArray(base.helpers)||base.helpers.length===0){ base.helpers=[{id:1,name:"小灯",plot:null},{id:2,name:"阿账",plot:null}]; base.helperSeq=2; }
    base.helpers.forEach(h=>{ if(h.plot!=null&&(!base.plots[h.plot]||!base.plots[h.plot].b)) h.plot=null; });
    if(!base.restockT) base.restockT={};
    ensurePlots();
    if(!base.hot||!base.hot.good){ base.hot={good:GOODS_ORDER[0],t:50}; base.hotNext=GOODS_ORDER[1]; }
    return base; } }catch(e){}
  const s=defaultState(); BEINGS.forEach(b=>s.beings[b.id]={rep:0}); return s;
}
function save(){ try{ S.lastSeenTs=Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

/* ============ 离线收益（放置核心：离开时商铺仍在运转） ============ */
function applyOffline(){
  const now=Date.now();
  const last=S.lastSeenTs||now;
  let sec=(now-last)/1000;
  S.lastSeenTs=now;
  if(sec<60) return;                 // 不足 1 分钟不结算
  if(sec>8*3600) sec=8*3600;         // 最多累计 8 小时，防止挂机刷爆
  const ar=altarRate();              // 祭坛离线信仰（信仰/秒）
  let faith=ar>0?Math.floor(ar*sec):0;
  let energy=0;
  const pb=planeBonus();
  if(pb.passiveEnergy){ const rate=pb.invincible?900:3000; const amt=pb.invincible?3:1; energy=Math.floor(sec/(rate/1000))*amt; }
  if(faith<=0&&energy<=0) return;
  if(faith>0){ S.faithCurrent+=faith; S.faithTotal+=faith; }
  if(energy>0){ S.energy+=energy; }
  save();
  showOfflineReport(sec, faith, energy);
}
function showOfflineReport(sec, faith, energy){
  const timeTxt = sec>=3600 ? ((sec/3600).toFixed(1)+" 小时") : (Math.floor(sec/60)+" 分钟");
  const modal=document.createElement("div");
  modal.id="offlineModal";
  modal.style.cssText="position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(20,10,35,.72);backdrop-filter:blur(4px);padding:18px";
  modal.innerHTML=`<div class="ev-card" style="text-align:center">
    <div class="ev-icon" style="font-size:44px">🌙</div>
    <h2 style="color:#5a2da0;margin:8px 0 6px">离线收益</h2>
    <div class="ev-desc" style="font-size:13px;line-height:1.7;color:#5a4b66;margin-bottom:14px">你离开了 <b>${timeTxt}</b>，商铺仍在运转——</div>
    <div style="font-size:15px;line-height:1.9;color:#5a4b66;margin:10px 0">${faith>0?("✦ 信仰 +"+faith+"<br>"):""}${energy>0?("🔮 能量 +"+energy+"<br>"):""}</div>
    <button class="story-next" style="background:linear-gradient(160deg,#ffd9ee,#d9ccff);color:#4a2a6b;border:0;cursor:pointer;font-size:15px;font-weight:700;padding:10px 36px;border-radius:999px;box-shadow:0 4px 16px #0006" onclick="this.closest('#offlineModal').remove()">收下</button>
  </div>`;
  document.body.appendChild(modal);
}

/* ============ 工具 ============ */
const $ = s=>document.querySelector(s);
function penalty(){ return 1 - Math.min(0.30, S.karma*0.003); }
function succPenalty(rate){ return Math.max(0.05, rate*(1 - Math.min(0.50, S.karma*0.005))); }
function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function faithBonus(){ return (1 + 0.08*(S.deityLevel-1)) * planeBonus().faithMul * planeBonus().allMul; }
function dropChance(b){ return Math.min(0.6, (0.14 + b.tier*0.07) * (planeBonus().dropMul>1?1.5:1)); }
function comboMul(){ return Math.min(2, 1 + S.combo*0.05); }
function goodsTotal(){ return GOODS_ORDER.reduce((s,k)=>s+S.goods[k],0); }
function toast(msg,cls){ const t=document.createElement("div"); t.className="toast "+(cls||""); t.textContent=msg; const box=$("#toast"); if(box) box.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ============ 货架（地块上的货架建筑） ============ */
function hasShelf(good){ return S.plots.some(p=>p.b==="shelf"&&p.good===good); }
function bestShelfLevel(good){ let lv=0; S.plots.forEach(p=>{ if(p.b==="shelf"&&p.good===good&&p.lv>lv) lv=p.lv; }); return lv; }
function shelfMul(good){ return [1,1,1.3,1.6][bestShelfLevel(good)||0]; }
function hotMul(req){ return (S.hot&&S.hot.good&&req.some(r=>r.good===S.hot.good))?1.5:1; }

function checkTasks(){
  TUTORIAL.forEach(t=>{
    if(!S.tasks[t.id] && t.prog()>=t.goal){
      S.tasks[t.id]=true;
      if(t.reward.nature) S.natureCurrency+=t.reward.nature;
      if(t.reward.energy) S.energy+=t.reward.energy;
      if(t.reward.faith){ const g=Math.round(t.reward.faith*faithBonus()); S.faithCurrent+=g;S.faithTotal+=g; }
      if(t.reward.rep) S.reputation+=t.reward.rep;
      toast("🏅 任务完成："+t.name+" · "+t.rw,"rep");
      sfx('level');
    }
  });
}
function refineOne(id){
  if((S.relics[id]||0)<=0){ toast("没有 "+RELICS[id].name,"karma"); return; }
  if(furnaceLv()<1){ toast("先建造 🔥炼化炉 才能炼化","karma"); return; }
  S.relics[id]--; const e=Math.round(RELICS[id].energy*refineMul()); S.energy+=e; S.refinedTotal++;
  toast("炼化 "+RELICS[id].name+" → +"+e+" 能量","energy"); sfx('refine'); afterAction();
}
function refineAll(){
  let total=0; BEINGS.forEach(b=>{ const c=S.relics[b.relic]||0; if(c>0){ total+=c*RELICS[b.relic].energy; S.relics[b.relic]=0; } });
  if(total<=0){ toast("暂无可炼化的超凡物品","karma"); return; }
  if(furnaceLv()<1){ toast("先建造 🔥炼化炉 才能炼化","karma"); return; }
  total=Math.round(total*refineMul()); S.energy+=total; S.refinedTotal++;
  toast("全部炼化 → +"+total+" 能量","energy"); sfx('refine'); afterAction();
}
function planeUp(){
  const p=S.plane; if(p>=10){ toast("已是位格巅峰·无敌","energy"); return; }
  if(templeLv()<1){ toast("需先建造 🛕飞升祭坛 才能飞升","karma"); return; }
  const cost=Math.round(PLANE_COST[p]*(1-0.08*(templeLv()-1)));
  if(S.energy<cost){ toast("能量不足（需"+cost+"）","energy"); return; }
  S.energy-=cost; S.plane++;
  const before=S.plots.length;
  ensurePlots();
  if(S.plane>=10){ S.invincible=true; }
  showAscend(S.plane, before);
  sfx('level'); afterAction();
}
function showAscend(lv, plotsBefore){
  const m=$("#ascend"); if(!m){ return; }
  $("#ascLv").textContent="Lv"+lv;
  $("#ascPerk").textContent=PLANE_PERK[lv]||"";
  const grew=plotCount()>plotsBefore;
  $("#ascUnlock").textContent=(grew?("🏗 商城扩张！地块 "+plotsBefore+" → "+plotCount()):"")+(S.plane>=10?" · 诸天万界，皆来臣服":"");
  m.style.display="flex";
  const btn=$("#ascBtn");
  if(btn) btn.onclick=()=>{ m.style.display="none"; };
}

/* ============ 音效 ============ */
let actx=null;
function initAudio(){ if(actx) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
function sfx(type){
  if(!actx || !SND_ENABLED || SND_VOL<=0) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.connect(g); g.connect(actx.destination);
  let f=440, dur=.15, vol=.12, wave='sine';
  if(type==='serve'){ f=660; dur=.12; }
  else if(type==='crit'){ f=990; dur=.2; wave='triangle'; vol=.16; }
  else if(type==='refine'){ f=330; dur=.35; wave='sawtooth'; }
  else if(type==='level'){ f=523; dur=.3; wave='triangle'; }
  else if(type==='fail'){ f=160; dur=.25; wave='square'; }
  else if(type==='event'){ f=440; dur=.2; wave='sine'; }
  else if(type==='build'){ f=392; dur=.18; wave='triangle'; }
  o.type=wave; o.frequency.setValueAtTime(f,now);
  if(type==='serve'||type==='crit'||type==='level'||type==='build') o.frequency.exponentialRampToValueAtTime(f*1.5,now+dur);
  if(type==='fail') o.frequency.exponentialRampToValueAtTime(f*0.5,now+dur);
  g.gain.setValueAtTime(vol*SND_VOL,now); g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.start(now); o.stop(now+dur+0.02);
}

/* ============ 修行采集 ============ */
function doCult(id){
  const c=CULTS.find(x=>x.id===id); if(!c) return;
  const now=Date.now();
  if(S.lastActionTs[id] && now-S.lastActionTs[id]<30000){ toast("操作过快，请稍候","karma"); return; }
  S.lastActionTs[id]=now;
  const pb=planeBonus();
  let mult = (S.buffs.丰穰>0 ? 1.5 : 1) * pb.cultMul * pb.allMul;
  if(c.streak){ S.streak.checkin++; const v=Math.min(25,10+(S.streak.checkin-1)*3); S.natureCurrency+=Math.round(v*mult); toast("+ "+Math.round(v*mult)+" 自然","nature"); }
  if(c.good){ const cap=goodsCap(); const room=cap-S.goods[c.good];
    if(room<=0){ toast("货仓已满（上限"+cap+"）——建 📮仓库 或先消耗","karma"); }
    else { const add=Math.min(c.n,room); S.goods[c.good]+=add; toast("入库 "+GOODS[c.good]+c.good+"×"+add+(add<c.n?"（货仓将满）":""),"rep"); } }
  if(c.nature && !c.streak){ S.natureCurrency+=Math.round(c.n*mult); toast("+ "+Math.round(c.n*mult)+" 自然","nature"); }
  if(c.faith){ const g=Math.round(c.faith*faithBonus()*penalty()*mult); S.faithCurrent+=g; S.faithTotal+=g; toast("+ "+g+" 信仰","faith"); }
  if(c.count){ S.counts[c.count]=(S.counts[c.count]||0)+1; }
  if(S.buffs.丰穰>0) S.buffs.丰穰--;
  if(S.plane>=3) autoRestock();
  sfx('serve'); afterAction();
}
function autoRestock(){
  const cap=goodsCap();
  GOODS_ORDER.forEach(k=>{ while(S.goods[k]<2 && S.goods[k]<cap && S.natureCurrency>=(RESTOCK[k]||5)){ S.natureCurrency-=(RESTOCK[k]||5); S.goods[k]++; } });
}
function buyGood(good,n){
  n=n||1; const cap=goodsCap(); const room=cap-S.goods[good];
  if(room<=0){ toast("货仓已满（上限"+cap+"）——建 📮仓库 扩容","karma"); return; }
  n=Math.min(n,room);
  const price=(RESTOCK[good]||5)*n;
  if(S.natureCurrency<price){ toast("自然货币不足（需"+price+"）","nature"); return; }
  S.natureCurrency-=price; S.goods[good]+=n;
  toast("进货 "+GOODS[good]+good+"×"+n+" · -"+price+"自然","rep");
  afterAction();
}

/* ============ 接待顾客（含货架/热销/偏爱/暴击/连击） ============ */
function canServe(cust){
  return cust.req.every(r=>hasShelf(r.good) && S.goods[r.good]>=r.n) && !(cust.being.costFaith && S.faithCurrent<cust.being.costFaith);
}
function serve(cust){
  const b=cust.being, req=cust.req;
  for(const r of req){
    if(!hasShelf(r.good)){ toast("未上架 "+GOODS[r.good]+r.good+"（点商铺里的货架布置）","karma"); return; }
    if(S.goods[r.good] < r.n){ toast("货仓缺 "+GOODS[r.good]+r.good+"×"+r.n+"（去📦货仓进货）","karma"); return; }
  }
  if(b.costFaith && S.faithCurrent < b.costFaith){ toast("信仰之力不足（需"+b.costFaith+"）","karma"); return; }
  for(const r of req){ S.goods[r.good]-=r.n; }
  const totalReq = req.reduce((s,r)=>s+r.n,0);
  const reqMul = Math.max(...req.map(r=>shelfMul(r.good)));
  const mul = (1 + 0.2*(totalReq-1)) * reqMul * hotMul(req) * (cust.big?1.8:1) * planeBonus().allMul * comboMul();
  const isPref = req.some(r=>r.good===b.pref);
  const loyal = (S.beings[b.id].rep>=50);
  const succ = b.succ ? (Math.random() < succPenalty(b.succ)) : true;
  if(succ){
    if(b.costFaith) S.faithCurrent-=b.costFaith;
    let gotFaith=0, gotNature=0;
    if(b.payFaith){ gotFaith=b.payFaith; }
    if(b.payFaithGamble){ if(Math.random()<0.5){ const g=Math.round(S.faithCurrent*rand(3,10)); gotFaith=g; } else { S.faithCurrent=0; gotFaith=-1; } }
    if(b.payNature) gotNature=b.payNature;
    const crit = Math.random() < (0.15 + (S.critLuck||0));
    const prefCrit = (isPref?1.3:1)*(loyal?1.2:1)*(crit?2:1);
    if(gotFaith>0) gotFaith=Math.round(gotFaith*faithBonus()*mul*prefCrit);
    if(gotNature>0) gotNature=Math.round(gotNature*mul*prefCrit);
    if(gotFaith>0){ S.faithCurrent+=gotFaith; S.faithTotal+=gotFaith; }
    if(gotNature>0){ S.natureCurrency+=gotNature; }
    if(b.boon==="丰穰"){ S.buffs.丰穰=3; }
    if(b.boon==="阴德护符"){ S.karma=0; S.inventory.阴德护符=(S.inventory.阴德护符||0)+1; }
    if(b.boon==="神谕·良缘"){ S.log.push("神谕·良缘"); }
    if(b.boon==="飞升"){ S.flying=true; }
    S.beings[b.id].rep=Math.min(100,S.beings[b.id].rep+10+(isPref?2:0));
    S.reputation+=2; S.deals++;
    if(S.critLuck>0) S.critLuck=0;
    S.combo++; if(S.combo>S.comboMax) S.comboMax=S.combo;
    if(Math.random() < dropChance(b)){
      S.relics[b.relic]=(S.relics[b.relic]||0)+1;
      if(!S.discovered){ S.discovered=true; toast("✨你发现：超凡物品竟能炼化成无所不能的能量！","disc"); }
      else toast("获得超凡物品 "+RELICS[b.relic].name+RELICS[b.relic].icon,"energy");
    }
    let msg=""; if(gotFaith>0) msg+="+"+gotFaith+" 信仰 "; if(gotNature>0) msg+="+"+gotNature+" 自然 ";
    if(isPref) msg+="·偏爱! "; if(loyal) msg+="·熟客 "; if(cust.big) msg+="·大单 "; if(b.boon) msg+="· "+b.boon; if(gotFaith===-1) msg="破财！信仰清零";
    cust.state="happy"; cust.el.classList.remove("wait"); cust.el.classList.add("happy");
    const bub=cust.el.querySelector(".bubble"); if(bub) bub.textContent="💗";
    if(crit && gotFaith>0){ floatText(cust,"暴击! "+msg,"crit"); sfx('crit'); } else { floatText(cust,msg,"faith"); sfx('serve'); }
    burstParticles(cust, crit?"#ffb84d":"#ffe08a");
    if(girlEl){ girlEl.classList.remove("nod"); void girlEl.offsetWidth; girlEl.classList.add("nod"); }
    setTimeout(()=>removeCust(cust),950);
  } else {
    S.beings[b.id].rep=Math.max(0,S.beings[b.id].rep+(b.fail.imp||0));
    S.reputation=Math.max(0,S.reputation-2); S.combo=0;
    if(b.fail.karma) S.karma=Math.min(100,S.karma+(b.fail.karma||0));
    cust.state="sad"; cust.el.classList.remove("wait"); cust.el.classList.add("sad");
    let msg="契约失败"; if(b.fail.consume) msg+="·货品损毁"; if(b.fail.karma) msg+="·业障+"+b.fail.karma;
    floatText(cust,msg,"karma"); sfx('fail');
    setTimeout(()=>removeCust(cust),950);
  }
  checkTasks(); afterAction();
}

/* ============ 店铺升级 / 神格 ============ */
const SHOP_COST=[0,200,500,1200,3000];
const DEITY_COST=[0,200,500,1200,3000,6000];
function shopUp(){
  const lv=S.shop.level; if(lv>=5){ toast("店铺已满级","faith"); return; }
  const cost=SHOP_COST[lv]; if(S.natureCurrency<cost){ toast("自然货币不足（需"+cost+"）","nature"); return; }
  S.natureCurrency-=cost; S.shop.level++;
  toast("店铺升至 Lv"+S.shop.level+"（服务位+1 · 解锁更高阶生物）","faith"); sfx('level'); afterAction();
}
function deityUp(){
  const lv=S.deityLevel; if(lv>=6){ toast("神格已满级","faith"); return; }
  const cost=DEITY_COST[lv]; if(S.faithCurrent<cost){ toast("信仰之力不足（需"+cost+"）","faith"); return; }
  S.faithCurrent-=cost; S.deityLevel++; toast("神格升至 Lv"+S.deityLevel+"（产出+8%）","faith"); sfx('level'); afterAction();
}
function advertise(){
  const cost=60;
  if(S.natureCurrency<cost){ toast("自然货币不足（广告需"+cost+"）","nature"); return; }
  S.natureCurrency-=cost; S.adsUsed=(S.adsUsed||0)+1;

function spawnInterval(){
  let base=Math.max(2500, 7000 - S.shop.level*900);
  if(signCount()>0) base*=Math.pow(0.85, signCount());
  if(planeBonus().attractHigh) base*=0.8;
  return Math.max(1500, base);
}
function slotX(i,n){ if(n<=1) return stageW/2; const pad=120, span=Math.max(40,stageW-pad*2); return pad+span*i/(n-1); }
function freeSlot(){
  const n=maxCust(), used=new Set(customers.filter(c=>(c.state==="enter"||c.state==="wait")).map(c=>c.slot));
  for(let i=0;i<n;i++) if(!used.has(i)) return i; return -1;
}
function spawnOne(b,slot,opts){
  opts=opts||{};
  const urgent=opts.urgent, big=opts.big;
  const tx=slotX(slot,maxCust()), req=genReq(b), voice=VOICES[b.id][rand(0,VOICES[b.id].length-1)];
  const col = b.tier>=4?"#fff0a0":(b.tier>=3?"#ffcf4d":(b.tier>=2?"#9be0c8":"#ffd0e6"));
  const el=document.createElement("div"); el.className="customer"+(urgent?" urgentc":"")+(big?" bigc":"");
  el.style.setProperty("--cc",col);
  el.style.setProperty("--tx",(stageW+80)+"px");
  const reqTxt=req.map(r=>GOODS[r.good]+"×"+r.n).join(" ");
  let ret=""; if(b.payFaith||b.payFaithGamble) ret+="✦"; if(b.payNature) ret+="❀"; if(b.boon) ret+="·"+b.boon; if(big) ret+="·大单";
  const prefHtml=`<div class="pref">偏爱 ${GOODS[b.pref]||b.pref}</div>`;
  const loyalHtml=(S.beings[b.id].rep>=50)?`<div class="loyal">熟客 · 带礼</div>`:"";
  const urgentHtml=urgent?`<div class="urgent">⚡急单 · 高价</div>`:"";
  const bigHtml=big?`<div class="big">📦大单 · 量大利厚</div>`:"";
  el.innerHTML=`<div class="bubble">${reqTxt} <b style="color:#9a7400">${ret}</b></div>
    ${prefHtml}${loyalHtml}${urgentHtml}${bigHtml}
    <div class="voice">${voice}</div>
    <div class="ring"><svg viewBox="0 0 60 60"><circle class="bg" cx="30" cy="30" r="26"></circle><circle class="fg" cx="30" cy="30" r="26"></circle></svg></div>
    <div class="body"></div><div class="face">${b.img?`<img src="${b.img}" alt="${b.name}">`:b.icon}</div><div class="plate">${b.name}</div>`;
  if(custLayer) custLayer.appendChild(el);
  const circ=el.querySelector(".ring .fg");
  const C=2*Math.PI*26;
  if(circ){ circ.style.strokeDasharray=C; circ.style.strokeDashoffset=0; }
  const cust={el,being:b,req,state:"enter",slot,patience:patienceMax(urgent,big),maxPatience:patienceMax(urgent,big),tx,wait:0,auto:0,urgent,big};
  customers.push(cust);
  requestAnimationFrame(()=>{ if(el&&el.isConnected){ el.style.setProperty("--tx",tx+"px"); } });
  el.addEventListener("click",()=>{ if(cust.state==="wait") serve(cust); });
  return cust;
}
function trySpawn(){
  if(eventActive) return;
  if(customers.filter(c=>(c.state==="enter"||c.state==="wait")).length>=maxCust()) return;
  let pool=BEINGS.filter(b=>beingUnlocked(b,S)); if(!pool.length) return;
  let b;
  const adPulse = S.adPulse>0;
  if(adPulse){ const hi=pool.filter(x=>x.tier>=2); b=(hi.length)?hi[rand(0,hi.length-1)]:pool[rand(0,pool.length-1)]; S.adPulse--; }
  else if(planeBonus().attractHigh){ const hi=pool.filter(x=>x.tier>=3); b=(hi.length&&Math.random()<0.6)?hi[rand(0,hi.length-1)]:pool[rand(0,pool.length-1)]; }
  else b=pool[rand(0,pool.length-1)];
  const slot=freeSlot(); if(slot<0) return;
  const urgent = b.tier>=2 && Math.random()<0.12;
  const big = b.tier>=2 && !urgent && Math.random()<0.14;
  spawnOne(b,slot,{urgent,big});
  if(S.beings[b.id].rep>=50 && Math.random()<0.4){
    const s2=freeSlot(); if(s2>=0) spawnOne(b,s2,{});
  }
}

let storeTimer=null;
function startStore(){
  storeCatchUp();
  if(storeTimer) clearInterval(storeTimer);
  storeTimer=setInterval(storeStep, 1500);
}
function stopStore(){
  if(storeTimer){ clearInterval(storeTimer); storeTimer=null; }
  if(S && S.store){ S.store.lastTs=Date.now(); try{ save(); }catch(e){} }
}
function storeCatchUp(){
  const now=Date.now(); let sec=(now-(S.store.lastTs||now))/1000; S.store.lastTs=now;
  if(sec<60){ try{ save(); }catch(e){} return; }
  if(sec>8*3600) sec=8*3600;
  const n=Math.floor(sec/4);                       // 平均 4s 一个异界顾客
  let earned=0, deals=0; const wIds=realWorldIds();
  for(let i=0;i<n;i++){ const r=storeSettle(wIds[rand(0,wIds.length-1)]); if(r){ earned+=r.gain; deals++; } }
  if(deals>0){ S.store.log.unshift({t:"离线", gain:earned, n:deals}); S.store.log=S.store.log.slice(0,8); }
  try{ save(); }catch(e){}
}
// 真实结算一笔：扣库存、加灵石、带回少许自然货币、记行情。返回成交信息或 null
function storeSettle(worldId){
  const w=REAL_WORLDS[worldId]; if(!w) return null;
  const candidates=[];
  REAL_GOODS.forEach(g=>{
    const have=S.store.inv[g.id]||0; if(have<=0) return;
    const price=S.store.price[g.id]||(g.cost*2); if(price<=0) return;
    const val=valuationOf(worldId,g.id);
    const psych=val*1.1;                            // 顾客心理中位价≈估值价
    if(price<=psych) candidates.push({g,price,val,match:g.cat===w.pref});
  });
  if(candidates.length===0) return null;
  candidates.sort((a,b)=>(b.match?1:0)-(a.match?1:0) || b.val-a.val);
  const pick=Math.random()<0.6 ? candidates[0] : candidates[rand(0,candidates.length-1)];
  S.store.inv[pick.g.id]--;
  S.coin+=pick.price;
  S.natureCurrency+=Math.max(1,Math.round(pick.price*0.05));   // 跨界馈赠：少许自然货币
  addStoreNote(worldId, pick.g.cat, pick.val);
  return {good:pick.g, gain:pick.price, worldId:worldId};
}
function addStoreNote(worldId, cat, val){
  const w=REAL_WORLDS[worldId];
  const key=worldId+"|"+cat;
  const exist=S.store.notes.find(x=>x.key===key);
  if(exist){ if(val>exist.val) exist.val=val; exist.cnt=(exist.cnt||0)+1; }
  else S.store.notes.push({key, worldId, cat, val, cnt:1});
  S.store.notes=S.store.notes.slice(-12);
}
function storeStep(){
  if(TAB!=="store"){ stopStore(); return; }
  const wIds=realWorldIds(); const wId=wIds[rand(0,wIds.length-1)]; const w=REAL_WORLDS[wId];
  const custEl=document.getElementById('storeCust');
  if(custEl) custEl.innerHTML=`<div class="cust"><div class="face">${w.face}</div><div class="say"><b>${w.name}</b> 自「${w.pref}」之界而来，正打量货架…</div></div>`;
  setTimeout(()=>{
    if(TAB!=="store") return;
    const r=storeSettle(wId);
    const c=custEl||document.getElementById('storeCust');
    if(c){
      if(r){ c.innerHTML=`<div class="cust"><div class="face">${w.face}</div><div class="say"><b>${w.name}</b> 收下 <b>${r.good.icon}${r.good.name}</b>，付你 <b>${r.gain}</b> 💠</div></div>`; toast(w.name+" 成交 +"+r.gain+"💠","rep"); sfx('build'); }
      else { c.innerHTML=`<div class="cust"><div class="face">${w.face}</div><div class="say"><b>${w.name}</b> 摇摇头：「这价位，老朽可不依」——空手离去。</div></div>`; }
    }
    if(r){ S.store.log.unshift({t:"live", worldId:wId, g:r.good.icon, gain:r.gain}); S.store.log=S.store.log.slice(0,8); }
    S.store.lastTs=Date.now();
    refreshStoreParts(); updateStats();
  }, 850);
}
function refreshStoreParts(){
  const invEl=document.getElementById('storeInv'); if(invEl) invEl.innerHTML=renderStoreInv();
  const logEl=document.getElementById('storeLog'); if(logEl) logEl.innerHTML=renderStoreLog();
  const noteEl=document.getElementById('storeNotes'); if(noteEl) noteEl.innerHTML=renderStoreNotes();

function buyReal(id){
  const g=REAL_GOODS.find(x=>x.id===id); if(!g) return;
  if(S.coin<g.cost){ toast("灵石不足（需 "+g.cost+"）","karma"); return; }
  S.coin-=g.cost; S.store.inv[id]=(S.store.inv[id]||0)+1;
  if(!S.store.price[id]) S.store.price[id]=g.cost*2;
  sfx('build'); updateStats(); refreshStoreParts(); try{ save(); }catch(e){}
  toast("进货 "+g.icon+g.name+" · -"+g.cost+"💠","nature");
}
function adjPrice(id, d){
  const g=REAL_GOODS.find(x=>x.id===id); if(!g) return;
  const cur=S.store.price[id]||(g.cost*2);
  S.store.price[id]=Math.max(Math.round(g.cost*0.5), Math.round(cur+d));
  refreshStoreParts(); try{ save(); }catch(e){}
}

function tick(dt){
  clock+=dt;
  if(S.hot){ S.hot.t-=dt/1000; if(S.hot.t<=0){ S.hot={good:S.hotNext,t:rand(40,70)}; const others=GOODS_ORDER.filter(g=>g!==S.hot.good); S.hotNext=others[rand(0,others.length-1)]; toast("🔥 热销切换为 "+GOODS[S.hot.good]+S.hot.good+"，下一波预告 "+GOODS[S.hotNext],"hot"); updateShopTop(); } }
  if(!eventActive){
    eventTimer-=dt; if(eventTimer<=0){ eventTimer=55000+Math.random()*45000; triggerEvent(); }
  }
  const pb=planeBonus();
  if(pb.passiveEnergy){ S.peTimer=(S.peTimer||0)+dt; const rate=pb.invincible?900:3000; if(S.peTimer>=rate){ S.peTimer=0; const a=pb.invincible?3:1; S.energy+=a; updateOrb(); } }
  // 祭坛被动产信仰（四条资源线之一）
  S.altarT=(S.altarT||0)+dt;
  if(S.altarT>=5000){
    S.altarT=0;
    let gained=0, firstIdx=-1;
    S.plots.forEach((p,idx)=>{ if(p.b==="altar"){
      if(firstIdx<0) firstIdx=idx;
      const amt=Math.max(1,Math.round((1+(p.lv-1)*0.8+(p.help!=null?1.2:0))*faithBonus()*planeBonus().allMul));
      S.faithCurrent+=amt; S.faithTotal+=amt; gained+=amt;
    } });
    if(gained>0){
      const pos=plotElPos(firstIdx);
      floatAt(pos,"⛩ +"+gained+" 信仰","faith");
      updateStats(); save();
    }
  }
  // 伙计自动补货（货架上有伙计时）
  S.plots.forEach((p,idx)=>{
    if(p.b==="shelf"&&p.help!=null&&p.good){
      S.restockT[idx]=(S.restockT[idx]||0)+dt;
      if(S.restockT[idx]>=9000){
        S.restockT[idx]=0;
        const cap=goodsCap();
        if(S.goods[p.good]<cap){
          const price=Math.max(1,Math.ceil((RESTOCK[p.good]||5)*0.5));
          if(S.natureCurrency>=price){
            S.natureCurrency-=price; S.goods[p.good]++;
            floatAt(plotElPos(idx),"📦 伙计补货 +1","nature");
            updateStats(); save();
          }
        }
      }
    }
  });
  if(!eventActive){
    spawnTimer-=dt; if(spawnTimer<=0){ spawnTimer=spawnInterval(); trySpawn(); }
  }
  for(const c of customers){
    if(c.state==="enter"){ c.wait+=dt; if(c.wait>=1100){ c.state="wait"; c.el.classList.add("wait"); } }
    else if(c.state==="wait"){
      const can=canServe(c);
      if(pb.autoServe && can){ c.auto+=dt; if(c.auto>=1200){ serve(c); continue; } }
      c.patience-=dt; const pr=Math.max(0,c.patience/c.maxPatience);
      const circ=c.el.querySelector(".ring .fg"); if(circ){ const C=2*Math.PI*26; circ.style.strokeDashoffset=(C*(1-pr)).toFixed(1); }
      if(c.patience<=0){ c.state="sad"; c.el.classList.remove("wait"); c.el.classList.add("sad"); S.reputation=Math.max(0,S.reputation-1); S.combo=0; afterAction(); setTimeout(()=>removeCust(c),950); }
    }
  }
}
function loop(t){
  if(!shopRunning) return;
  if(!lastT) lastT=t; let dt=t-lastT; lastT=t; if(dt>100) dt=100;
  try{ tick(dt); }catch(e){}
  requestAnimationFrame(loop);
}

  trySpawn(); trySpawn(); trySpawn();

}

function showStory(){
  if(S.storySeen){ _splash.classList.add('bye'); setTimeout(()=>{ if(_splash.parentNode) _splash.remove(); },520); boot(); return; }
  _splash.classList.add('bye'); setTimeout(()=>{ if(_splash.parentNode) _splash.remove(); },520);
  _story.style.display="flex"; _storyIdx=0; _storyText.innerHTML=STORY_PAGES[0];
}
/* ============ 设置 + 存档导入导出 ============ */
function applyAnim(){ if(ANIM_ON) document.body.classList.remove('no-anim'); else document.body.classList.add('no-anim'); }
function openSettings(){ const m=document.getElementById('settingsModal'); if(!m)return;
  document.getElementById('setSnd').checked=SND_ENABLED;
  document.getElementById('setAnim').checked=ANIM_ON;
  document.getElementById('setVol').value=Math.round(SND_VOL*100);
  document.getElementById('setVolVal').textContent=Math.round(SND_VOL*100)+'%';
  document.getElementById('saveCode').value="";
  document.getElementById('setMsg').textContent="";
  m.style.display="flex"; }
function closeSettings(){ const m=document.getElementById('settingsModal'); if(m) m.style.display="none"; }
function setMsg(t){ const e=document.getElementById('setMsg'); if(e) e.textContent=t; }
function exportSave(){
  save(); const data=JSON.stringify(S);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download="faith-trade-save-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  URL.revokeObjectURL(a.href); setMsg("已导出存档文件"); }
function importSaveFile(file){
  const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); applySave(d); }catch(e){ setMsg("导入失败：文件不是有效存档"); } };
  rd.readAsText(file); }
function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64d(s){ return decodeURIComponent(escape(atob(s))); }
function genCode(){ save(); document.getElementById('saveCode').value=b64e(JSON.stringify(S)); setMsg("分享码已生成，可复制"); }
function copyCode(){ const t=document.getElementById('saveCode'); if(!t||!t.value){ setMsg("没有可复制的分享码"); return; } t.select();
  try{ document.execCommand('copy'); setMsg("已复制到剪贴板"); }
  catch(e){ if(navigator.clipboard){ navigator.clipboard.writeText(t.value).then(()=>setMsg("已复制"),()=>setMsg("复制失败，请手动复制")); } } }
function importCode(){ const v=document.getElementById('saveCode').value.trim(); if(!v){ setMsg("请先粘贴分享码"); return; }
  try{ const d=JSON.parse(b64d(v)); applySave(d); }catch(e){ setMsg("分享码无效"); } }
function applySave(d){ if(!d||typeof d!=="object"){ setMsg("存档无效"); return; }
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(d)); location.reload(); }catch(e){ setMsg("写入失败"); } }
function resetSave(){ if(!confirm("确定清空当前存档？此操作不可恢复，建议先导出备份。")) return;
  try{ localStorage.removeItem(SAVE_KEY); location.reload(); }catch(e){} }

function boot(){ try{ applyOffline(); render(); }catch(e){ showErr(e.message); } }
if(_splash&&_startBtn){
  _startBtn.addEventListener('click',()=>{ initAudio(); showStory(); });
  _storyNext.addEventListener('click',()=>{
    _storyIdx++;
    if(_storyIdx>=STORY_PAGES.length){ S.storySeen=true; save(); _story.classList.add('bye'); setTimeout(()=>{ if(_story.parentNode) _story.remove(); },520); boot(); }
    else { _storyText.innerHTML=STORY_PAGES[_storyIdx]; if(_storyIdx===STORY_PAGES.length-1) _storyNext.textContent="开始营业"; }
  });
}else{
  boot();
}
</script>
</body>
</html>
