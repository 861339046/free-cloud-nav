<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>诡秘之主 · 序列之路</title>
<style>
  :root{
    --bg:#0a0e14; --bg2:#0f1620; --card:#121b24; --line:#22303c;
    --ink:#d8e2ea; --muted:#8da0b0; --dim:#5c6e7e;
    --gold:#e8c06a; --teal:#5fd0c5; --teal2:#3a9d94; --brass:#caa24a; --brass2:#9c7e35;
    --blood:#e0586a; --good:#7fd08a; --fool:#9b7bd8; --door:#5fb6e8; --error:#e08b5f;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:radial-gradient(140% 120% at 50% -10%, #16202c 0%, var(--bg) 60%);color:var(--ink);
    font-family:"Songti SC","SimSun",ui-serif,Georgia,serif;-webkit-font-smoothing:antialiased}
  #app{max-width:780px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  /* 顶栏 */
  #top{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:8px 12px;background:linear-gradient(180deg,rgba(14,22,32,.96),rgba(14,22,32,.82));
    border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  #top .ttl{font-size:15px;color:var(--gold);letter-spacing:1px;font-weight:700;margin-right:4px;white-space:nowrap}
  .stat{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:9px;padding:4px 7px;font-size:12px;color:var(--muted);white-space:nowrap}
  .stat b{color:var(--gold);font-variant-numeric:tabular-nums}
  .stat .ico{margin-right:3px}
  .stat .lbl{display:inline;margin-left:7px;color:var(--dim)}
  .madbar{position:relative;width:60px;height:10px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--line)}
  .madbar i{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#caa24a,#e0586a);transition:width .3s}
  .spacer{flex:1}
  .menu-btn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
  /* Tab */
  #tabs{display:flex;gap:6px;padding:8px 10px 0;flex-wrap:wrap}
  #tabs button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
  #tabs button.on{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:700}
  #view{padding:12px 12px 90px;flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 10px;font-size:18px;color:var(--gold);letter-spacing:.5px}
  .card h3{margin:16px 0 8px;font-size:14px;color:var(--teal)}
  .lead{color:var(--ink);font-size:13.5px;line-height:1.7;margin:6px 0}
  .mini{color:var(--muted);font-size:12px;line-height:1.6;margin:6px 0}
  .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:4px 0}
  .prog{height:9px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--teal));transition:width .3s}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn{font-family:inherit;border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;cursor:pointer;transition:.15s}
  .btn.primary{background:linear-gradient(180deg,var(--gold),var(--brass));color:#1a1206;font-weight:700}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .btn.danger{color:var(--blood);border-color:rgba(224,88,106,.4)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .buy-btn{font-family:inherit;background:rgba(255,255,255,.05);border:1px solid var(--gold);color:var(--gold);
    border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
  .buy-btn:hover{background:rgba(255,255,255,.13)}
  .choice{display:block;width:100%;text-align:left;background:rgba(0,0,0,.22);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin:9px 0;cursor:pointer;color:var(--ink);font-family:inherit;transition:.15s}
  .choice:hover{border-color:var(--teal2);background:rgba(95,208,197,.08)}
  .choice .sub{color:var(--muted);font-size:12px;margin-top:4px}
  .choice .gain{color:var(--brass2);font-size:12px;margin-top:5px}
  .choice .cost{color:var(--blood);font-size:12px;margin-top:2px}
  .choice.dis{opacity:.45;cursor:not-allowed}
  .soliloquy{background:rgba(155,123,216,.1);border-left:3px solid var(--fool);border-radius:0 10px 10px 0;
    padding:11px 14px;margin:12px 0;font-style:italic;color:#e6dcff;font-size:13px;line-height:1.75}
  .fit{font-size:12px;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:middle}
  .fit.perfect{background:rgba(127,208,138,.18);color:var(--good)}
  .fit.ok{background:rgba(95,208,197,.16);color:var(--teal)}
  .fit.fail{background:rgba(224,88,106,.16);color:var(--blood)}
  .seq-hero{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .seq-emblem{font-size:38px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;
    background:rgba(155,123,216,.12);border-radius:12px;flex:0 0 auto}
  .seq-name{font-size:17px;color:var(--gold);font-weight:700}
  .seq-en{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
  .seq-desc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .seq-tag{font-size:10px;background:var(--gold);color:#1a1206;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .acts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .ab{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px}
  .ab b{color:var(--teal)}
  .recipe{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:8px 0}
  .mat{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .mat:last-child{border-bottom:none}
  .mat .hav{color:var(--good)} .mat .no{color:var(--blood)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
  .pw{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:11px;padding:10px}
  .pn{font-size:13px;color:var(--gold)} .ps{font-size:11px;color:var(--dim)}
  /* 日记 */
  .diary{margin-top:16px}
  .diary h3{margin-top:6px}
  .diary-item{background:#101a20;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:7px 0;font-size:12.5px;line-height:1.55}
  .diary-item .dh{color:var(--gold);font-size:12px}
  .diary-item .dm{color:var(--muted);margin-top:3px}
  .diary-item.recall{cursor:pointer;transition:.15s}
  .diary-item.recall:hover{border-color:var(--teal2);background:#13202a;transform:translateY(-1px)}
  .diary-empty{color:var(--dim);font-size:12.5px;margin-top:8px}
  /* 世界地图 */
  .map{position:relative;background:linear-gradient(160deg,#0c1420,#0a1019);border:1px solid var(--line);
    border-radius:16px;padding:14px;margin-bottom:14px;overflow:hidden}
  .map-title{font-size:13px;color:var(--gold);letter-spacing:1px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .map-title .mini{font-size:11px}
  .locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .loc{position:relative;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;transition:.15s;overflow:hidden}
  .loc:hover{border-color:var(--teal2);transform:translateY(-2px)}
  .loc .em{font-size:26px}
  .loc .ln{font-size:13px;color:var(--ink);margin-top:5px;font-weight:600}
  .loc .ld{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45}
  .loc .riski{position:absolute;top:8px;right:9px;font-size:10px;padding:1px 7px;border-radius:999px}
  .riski.low{background:rgba(127,208,138,.16);color:var(--good)}
  .riski.mid{background:rgba(234,192,106,.16);color:var(--brass2)}
  .riski.high{background:rgba(224,88,106,.16);color:var(--blood)}
  .loc.done{opacity:.55}
  .loc.done::after{content:'✓';position:absolute;top:8px;right:10px;color:var(--good);font-size:13px}
  .scene{background:linear-gradient(160deg,#101a24,#0c131c);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .scene .shead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .scene .sem{font-size:30px}
  .scene .stitle{font-size:16px;color:var(--gold);font-weight:700}
  .scene .sdesc{color:var(--ink);font-size:13.5px;line-height:1.75;margin:8px 0}
  .check-hint{font-size:11.5px;color:var(--dim);margin-top:6px}
  .res-good{color:var(--good)} .res-bad{color:var(--blood)}
  /* 途径选择 */
  .path-hero{background:radial-gradient(120% 100% at 50% 0%,rgba(155,123,216,.18),rgba(10,14,20,.6));
    border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center;margin-bottom:14px}
  .path-hero h1{font-size:24px;color:var(--gold);margin:0 0 6px;letter-spacing:2px}
  .path-hero p{color:var(--muted);font-size:13px;line-height:1.7;margin:4px 0}
  .camp-title{font-size:13px;color:var(--teal);margin:16px 0 8px;letter-spacing:1px;border-left:3px solid var(--teal2);padding-left:8px}
  .path-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
  .path-card{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:11px 10px;cursor:pointer;transition:.15s;text-align:center}
  .path-card:hover{border-color:var(--gold);transform:translateY(-2px);background:rgba(232,192,106,.08)}
  .path-card .pe{font-size:28px}
  .path-card .pn{font-size:13px;color:var(--ink);margin-top:5px;font-weight:600}
  .path-card .pc{font-size:10px;color:var(--dim);margin-top:2px}
  .path-card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,192,106,.35)}
  .path-card .pill{display:inline-block;font-size:9px;padding:1px 6px;border-radius:999px;margin-top:5px;background:rgba(95,208,197,.14);color:var(--teal)}
  .path-card .pill.gen{background:rgba(140,160,176,.14);color:var(--dim)}
  /* 弹窗 */
  #modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(4,7,12,.72);padding:18px}
  #modal.show{display:flex}
  #modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:var(--shadow);position:relative}
  #modal .x{position:absolute;top:12px;right:14px;cursor:pointer;color:var(--muted);font-size:18px}
  #modal h2{margin:0 0 10px;font-size:19px;color:var(--gold)}
  #modal .lead{font-size:13.5px;line-height:1.7}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;
    background:rgba(20,30,40,.95);border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:13px;transition:.25s;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 窄屏 */
  @media (max-width:680px){
    #top{font-size:11px;gap:5px;padding:7px 9px}
    .stat{padding:3px 7px;font-size:11px}
    .stat .lbl{display:none}
    .ttl{font-size:13px}
    #tabs button{padding:5px 11px;font-size:12px}
    .madbar{width:42px}
    .loc .ld{display:none}
    .path-hero h1{font-size:20px}
  }
  @media (max-width:420px){
    #top{font-size:10px}
    .stat .ico{margin:0}
    .madbar{width:34px}
    .locs{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
    .path-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
    .attrs{grid-template-columns:repeat(2,1fr)}
  }
  /* 角色属性 */
  .attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px}
  .attr{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
  .attr .an{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
  .attr .an b{color:var(--gold);font-variant-numeric:tabular-nums;font-size:14px}
  .attr .abar{height:6px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden;margin-top:6px}
  .attr .abar i{display:block;height:100%;background:linear-gradient(90deg,var(--fool),var(--teal));transition:width .3s}
  .portrait{width:84px;height:84px;border-radius:16px;object-fit:cover;border:2px solid var(--gold);flex:0 0 auto;background:rgba(0,0,0,.3)}
  .portrait-fallback{width:84px;height:84px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:40px;background:rgba(155,123,216,.12);border:2px solid var(--gold);flex:0 0 auto}
  .npc{display:flex;gap:10px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
  .npc .ne{font-size:28px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:rgba(155,123,216,.12);border-radius:10px;flex:0 0 auto}
  .npc .nn{font-size:13px;color:var(--gold);font-weight:700}
  .npc .nr{font-size:11px;color:var(--teal);margin-top:1px}
  .npc .nb{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  /* 穿越者 · 序章 */
  .pro-hero{background:radial-gradient(130% 110% at 50% 0%,rgba(155,123,216,.2),rgba(10,14,20,.72));
    border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center;margin-bottom:14px}
  .pro-hero .pno{font-size:11.5px;letter-spacing:3px;color:var(--teal)}
  #top.pre .stat{display:none}
  .pro-hero h1{font-size:23px;color:var(--gold);margin:6px 0 8px;letter-spacing:2px}
  .pro-hero p{color:var(--muted);font-size:13px;line-height:1.85;margin:6px 0;text-align:left}
  .pro-hero .lead{color:var(--ink);font-size:13.5px}
  .pro-quote{background:rgba(155,123,216,.1);border-left:3px solid var(--fool);border-radius:0 10px 10px 0;
    padding:10px 14px;margin:12px 0;font-style:italic;color:#e6dcff;font-size:13px;line-height:1.8;text-align:left}
  .pro-field{display:flex;align-items:center;gap:9px;margin:14px 0 4px;flex-wrap:wrap}
  .pro-field label{font-size:12.5px;color:var(--muted)}
  .pro-field input{font-family:inherit;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:9px;
    padding:8px 11px;color:var(--gold);font-size:13px;width:180px;outline:none}
  .pro-field input:focus{border-color:var(--gold)}
  .pro-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px;margin-top:10px}
  .pro-card{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.15s;text-align:left;color:var(--ink);font-family:inherit}
  .pro-card:hover{border-color:var(--gold);transform:translateY(-2px);background:rgba(232,192,106,.07)}
  .pro-card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,192,106,.3)}
  .pro-card .pem{font-size:24px}
  .pro-card .pn2{font-size:13px;color:var(--gold);font-weight:700;margin-top:4px}
  .pro-card .pd{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:5px}
  .pro-card .pg{font-size:11px;color:var(--teal);margin-top:6px}
  .pro-meta{background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;text-align:left}
  .pro-meta .row{display:flex;gap:8px;font-size:12.5px;color:var(--muted);padding:4px 0;border-bottom:1px dashed var(--line)}
  .pro-meta .row:last-child{border:none}
  .pro-meta .row b{color:var(--ink);min-width:62px}
  .choice.modern{border-color:rgba(95,208,197,.55);background:linear-gradient(100deg,rgba(95,208,197,.1),rgba(0,0,0,.22))}
  .choice.modern:hover{border-color:var(--teal)}
  .choice.modern .mtag{display:inline-block;font-size:10px;color:var(--teal);border:1px solid var(--teal2);border-radius:999px;padding:1px 7px;margin-bottom:5px}
  .origin-box{display:flex;gap:12px;align-items:flex-start;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
  .origin-box .p2{font-size:13px;color:var(--gold);font-weight:700;line-height:1.6}
  .origin-box .p3{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.6}
  .mem-chip{display:inline-block;font-size:11.5px;background:rgba(95,208,197,.12);border:1px solid var(--teal2);
    color:var(--teal);border-radius:999px;padding:4px 10px;margin:3px 5px 3px 0}
  .suspbar{height:9px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
  .suspbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass2),var(--blood));transition:width .3s}
  .susp-safe{color:var(--good)} .susp-warn{color:var(--gold)} .susp-bad{color:var(--blood)}
  @media (max-width:420px){ .pro-cards{grid-template-columns:1fr} .pro-hero h1{font-size:20px} }
  /* ===== 活的世界 · 今日世界 ===== */
  .world-date{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:linear-gradient(100deg,rgba(232,192,106,.09),rgba(0,0,0,.2));border:1px solid var(--brass2);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .world-date .wd1{font-size:20px;color:var(--gold);font-weight:700;letter-spacing:.5px}
  .world-date .wd2{font-size:12.5px;color:var(--muted)}
  .world-date .wem{font-size:22px}
  .news{background:#111a22;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .news .nh{background:linear-gradient(180deg,#1b2732,#141e27);border-bottom:2px solid var(--brass2);padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .news .nh b{color:var(--gold);font-size:16px;letter-spacing:3px}
  .news .nh span{color:var(--dim);font-size:11px}
  .news .ni{padding:10px 14px;border-bottom:1px dashed var(--line)}
  .news .ni:last-child{border-bottom:none}
  .news .nc{font-size:10.5px;color:var(--teal);letter-spacing:1px;border:1px solid var(--teal2);border-radius:999px;padding:1px 7px;margin-right:6px}
  .news .nt{font-size:12.5px;color:var(--ink);line-height:1.75}
  .bill{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .bill:last-child{border:none}
  .bill b{color:var(--ink)}
  .bill .amt{color:var(--gold);font-variant-numeric:tabular-nums}
  .fac{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px;color:var(--muted)}
  .fac .fn{min-width:120px;color:var(--ink)}
  .fac .fb{flex:1;height:7px;background:rgba(0,0,0,.4);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
  .fac .fb i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--gold))}
  .fac .fv{min-width:34px;text-align:right;color:var(--gold)}
  .sched{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .sched:last-child{border:none}
  .sched .se{font-size:18px}
  .sched .sn{color:var(--gold)}
  .sched .sl{color:var(--muted)}
  .wev{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}

// 其余 19 途径：真实名称+阵营+入口序列（若确知），中间序列游戏化整理
function genSeqs(p){
  // 整理占位途径：能力名随序列层级变化，避免十级都叫「X之力 / X之术」
  const AB_LOW=['初窥','潜形','惑影','镜身','咒缚','灾相','权柄','半神','真形','旧日'];
  const AB_HIGH=['感应','隐匿','拟态','反照','束缚','降临','支配','神临','化形','归源'];
  const entry=p.entry||(p.name+'之徒');
  const names=[entry];
  // 原著术语为「序列」，占位序列名不再使用「阶」；并明确标注为游戏整理
  for(let k=1;k<9;k++) names.push(p.name+'途径 · 序列 '+(9-k));
  names.push(p.name);
  return names.map((nm,i)=>{
    const seq=9-i;
    const isEntry=i===0, isTop=seq===0;
    return {
      name:nm, e:p.en+' '+(10-seq), em:p.emoji,
      d: isEntry?('踏上'+p.name+'途径，初窥非凡之秘。'):(isTop?('登临'+p.name+'之巅，执掌其权柄。'):'（游戏整理序列，以原著设定为准）'),
      act: isEntry?('以'+p.name+'之姿融入世俗，不露锋芒。'):('恪守'+p.name+'之道，渐入化境。'),
      ab:[ [p.name+'·'+AB_LOW[i], '序列 '+seq+' 的低阶能力（游戏整理，以原著为准）'],
           [p.name+'·'+AB_HIGH[i], '序列 '+seq+' 的高阶能力（游戏整理，以原著为准）'] ],
      // 主材料名统一为「序列 N 非凡特性 · X途径」：术语正确、与途径绑定、每级唯一
      rec:{main:'序列 '+seq+' 非凡特性 · '+p.name+'途径', aux:['星水晶','安神草']},
      mad:14+(9-seq)*2
    };
  });
}
function mkGen(o){ return Object.assign({real:false,seqs:genSeqs(o)},o); }

function addFrag(){
  if(!G||!G.origin) return;
  const cap=ORIGIN_MEMORIES.length;
  const before=Math.min(G.origin.frag||0, cap);
  if(before>=cap){ G.origin.frag=cap; return; }   // 已集齐：不再无意义增长（避免脏档越界）
  G.origin.frag=before+1;
  const m=ORIGIN_MEMORIES[before];
  if(m) toast('拾起一片原身记忆 · '+m.t);
  if(!G.origin.fragDone && G.origin.frag>=ORIGIN_MEMORIES.length){
    G.origin.fragDone=true;
    G.origin.suspicion=Math.max(0,(G.origin.suspicion||0)-10);
    toast('拼回了他的一生 · 演起来更像了（暴露风险 -10）');
  }
}
// 记忆闪回：把已拾起的原身记忆做成可交互的「回忆事件」——点开是一片氛围闪回，并给出一次轻互动
function recallMemory(idx){
  if(!G||!G.origin) return;
  const m=ORIGIN_MEMORIES[idx];
  if(!m) return;
  const recalled=(G.origin.recalled||[]);
  const done=recalled.indexOf(idx)>=0;
  showModal(`<span class="x" onclick="closeModal()">✕</span>
    <h2 style="color:var(--gold)">🕯️ ${m.t}</h2>
    <p class="lead">${m.d}</p>
    <div class="soliloquy">${m.feel}</div>
    ${done?`<p class="mini" style="color:var(--dim)">你已与这段记忆共处过了。</p>`
      :`<div class="acts" style="margin-top:12px">
          <button class="btn ghost" onclick="recallChoose(${idx},'immerse')">沉浸其中 · 更懂「他」一点（消化 +4）</button>
          <button class="btn ghost" onclick="recallChoose(${idx},'suppress')">压下情绪 · 不让外人看出异样（暴露 -2）</button>
        </div>`}
    <p class="mini" style="margin-top:10px">🕯️ 片段为游戏化原创演绎，用于让「借来的身体」有重量，非原著情节。</p>`);
}
function recallChoose(idx,choice){
  if(!G||!G.origin) return;
  const o=G.origin;
  if(!Array.isArray(o.recalled)) o.recalled=[];
  if(o.recalled.indexOf(idx)>=0){ closeModal(); return; }
  o.recalled.push(idx);
  if(choice==='immerse'){ G.acting+=4; toast('沉浸回忆 · 消化 +4'); }
  else { o.suspicion=Math.max(0,(o.suspicion||0)-2); toast('压下情绪 · 暴露 -2'); }
  save(); closeModal(); renderView();
}

/* ---- 活的世界 · 计算与流转 ---- */
function worldHash(n,salt){ return (((n*9301+(salt||49297))%233280)+233280)%233280/233280; }
function worldDate(day){
  const d=Math.max(1,Math.floor(day||1)), idx=d-1;
  const y=1349+Math.floor(idx/360), within=idx%360;
  const m=Math.floor(within/30)+1, md=within%30+1, wd=idx%7;
  const w=WEATHERS[Math.floor(worldHash(d,77)*WEATHERS.length)%WEATHERS.length];
  const fest=FESTIVALS[md]||(wd===6?'礼拜日':null);
  return {y,m,md,wd,weekday:WEEKDAYS[wd],weather:w,festival:fest,
    label:'第五纪 '+y+' 年 '+m+' 月 '+md+' 日 · '+WEEKDAYS[wd]};
}
function fmtMoney(g){
  const neg=g<0, total=Math.round(Math.abs(g||0)*ECONOMY.poundToSoll*ECONOMY.sollToPenny);
  const pound=Math.floor(total/240), soll=Math.floor((total%240)/12), penny=total%12;
  let s=pound?pound+' 金镑':'';
  if(soll) s+=(s?' ':'')+soll+' 苏勒';
  if(penny) s+=(s?' ':'')+penny+' 便士';
  if(!s) s='0 便士';
  return (neg?'欠 ':'')+s;
}
function ensureWorld(){
  if(!G) return;
  if(typeof G.gold!=='number'||!isFinite(G.gold)) G.gold=0;
  if(!Array.isArray(G.echoes)) G.echoes=[];
  if(!Array.isArray(G.ledger)) G.ledger=[];
  if(!Array.isArray(G.worldLog)) G.worldLog=[];
  if(!G.relations||typeof G.relations!=='object') G.relations={};
  if(!G.factions||typeof G.factions!=='object') G.factions={};
  if(!G.worldFlags||typeof G.worldFlags!=='object') G.worldFlags={};
  if(!G.city||(G.city!=='tingen'&&G.city!=='backlund')) G.city='tingen';
  if(!G.commission||typeof G.commission!=='object') G.commission={done:0,failed:0,doneDay:0,log:[]};
  if(!G.billState||typeof G.billState!=='object') G.billState=null;
  if(typeof G.debt!=='number') G.debt=0;
}
function weekIndex(){ return Math.floor((Math.max(1,G.day)-1)/7); }
function billState(){
  ensureWorld(); const wk=weekIndex();
  if(!G.billState||G.billState.week!==wk) G.billState={week:wk,paid:false,remitted:false,skipped:false};
  return G.billState;
}
function relation(k,n){ if(!k) return; ensureWorld(); G.relations[k]=Math.max(-100,Math.min(100,(G.relations[k]||0)+n)); }
function faction(k,n){ if(!k) return; ensureWorld(); G.factions[k]=Math.max(-100,Math.min(100,(G.factions[k]||0)+n)); }
function addLedger(t){ ensureWorld(); G.ledger.unshift({day:G.day,text:t}); if(G.ledger.length>24) G.ledger.length=24; }
function addEcho(act){ ensureWorld(); if(!act) return; G.echoes.unshift({day:G.day,act}); if(G.echoes.length>12) G.echoes.length=12; }
function echoVoice(){
  const s=(G.origin&&G.origin.suspicion)||0, nh=(G.factions&&G.factions.nighthawk)||0;
  if(s>=70||nh<=-20) return '水仙花街 2 号那位姓莫雷蒂的年轻住客';
  if(s>=40) return '一名与黑荆棘新晋文员身形相符的年轻人';
  if(s>=20&&nh<0) return '有人（据说是黑荆棘的人）';
  return '有人';
}
// 传闻句子拼接：回声若是自带主语的完整句（如「房东在门上贴了字条」），就不再叠加主语，
// 避免出现「有人房东…」「有人有人见其…」这类错句。
function echoSentence(e){
  if(!e) return '';
  const a=e.act||'';
  if(/^(有人|房东|报童|值夜者|教会|神父|一位|一名|水仙花街|邓恩|伦纳德|老尼尔)/.test(a)) return a;
  // 本身含否定的句子（「无人见其行踪…」）不能再加主语，改用传闻口吻
  if(/^(无人|不见|未有人|据传|有传闻)/.test(a)) return '有传闻称：'+a;
  return echoVoice()+a;
}
function cityEvents(){ return (G&&G.city==='backlund')?BACKLUND_EVENTS:WORLD_EVENTS; }
function todayEvent(day){ const arr=cityEvents(); const n=arr.length; return arr[(((day-1)%n)+n)%n]; }
function makeNews(day){
  ensureWorld();
  const wd=worldDate(day), ev=todayEvent(day), prev=todayEvent(day-1);
  const sus=(G.origin&&G.origin.suspicion)||0, last=G.echoes[0], flag=G.worldFlags[(G.city||'tingen')+':'+prev.id];
  const follow=flag==='joined'
    ? '续报：'+prev.title+'一事，据称已有热心市民向值夜者递了线索，案情有了新方向。'
    : (flag==='passed' ? '续报：'+prev.title+'一事终归沉寂，报馆已撤下版面。'
       : '续报：'+prev.title+'一事仍在议论，尚无定论。');
  const rumor=last
    ? echoSentence(last)+'。'+(sus>=70?'已有不止一人说，那位年轻人「不像他自己」。':(sus>=40?'有人开始打听他的来历。':'多数人只当是雾里的闲话。'))
    : '近日无关于你的闲话。';
  return [
    {c:'本市要闻',em:'📰',t:'<b>'+ev.title+'</b>。'+ev.body+' <span class="mini">'+follow+'</span>'},
    {c:'天气与市情',em:wd.weather.em,t:wd.weather.name+'。'+wd.weather.desc+'。'+wd.weather.news+'。'},
    {c:'市井传闻',em:'🕯️',t:'<span class="echo">'+rumor+'</span>'},
    {c:'分类广告',em:'🪙',t:'黑市行情：非凡材料今日'+(wd.wd===1?'略降':(wd.wd===5?'略涨':'平稳'))+'；招聘：黑荆棘安保公司诚聘文员，周薪 '+fmtMoney(ECONOMY.weeklyWage)+'。'},
  ];
}
function advanceDay(reason, echoAct, tag){
  ensureWorld();
  const prevBs=Object.assign({},billState()), prevWk=weekIndex();
  G.day++;
  addEcho(echoAct||reason||'在城中度过一日');
  if(tag==='blackthorn'||tag==='chanis') faction('nighthawk',1);
  else if(tag==='church') faction('church',1);
  else if(tag==='tarot') faction('tarot',2);
  else if(tag==='east') faction('aurora',1);
  else if(tag==='port') faction('tarot',1);
  if(((G.origin&&G.origin.suspicion)||0)>=60 && tag!=='home') faction('nighthawk',-1);
  // 跨周：上周未结则留下催租痕迹（不自动惩罚挂机，暴露只在主动拖欠时产生）
  if(weekIndex()!==prevWk){
    if(!prevBs.paid && !prevBs.skipped){
      G.debt=(G.debt||0)+ECONOMY.weeklyRent;
      relation('班森',-2); relation('梅丽莎',-2); faction('nighthawk',-1);
      addLedger('上周账单未结，房东把字条贴在了门上。');
      addEcho('房东在门上贴了催租字条');
    } else addLedger('新的一周开始，本周账单已送达。');
    G.billState={week:weekIndex(),paid:false,remitted:false,skipped:false};
  }
}

let G=null;
function newGame(pathway,intro){
  const i=intro||{};
  const job=MODERN_JOBS.find(j=>j.id===i.job)||MODERN_JOBS[0];
  const react=PRO_REACTS.find(r=>r.id===i.react)||PRO_REACTS[0];
  const attrs={灵性:4,灵感:6,体魄:5,意志:6,学识:7,魅力:5};
  for(const k in (job.attrs||{})) attrs[k]=(attrs[k]||5)+job.attrs[k];
  for(const k in (react.attrs||{})) attrs[k]=(attrs[k]||5)+react.attrs[k];
  return {
    pathway:pathway, seq:9, acting:0, actingNeed:30, city:'tingen',
    madness:0, gold:12, day:1,
    attrs:attrs,
    origin:{
      modernName:i.name||'你', job:job.id, jobName:job.name,
      bodyName:ORIGIN.body, bodyEn:ORIGIN.bodyEn, address:ORIGIN.address, world:ORIGIN.world,
      memories:(i.mems||[]).slice(0,2), react:react.id,
      suspicion:Math.max(0,react.sus||0), frag:0, recalled:[],
    },
    inv:{'星水晶':2,'安神草':2,'水银':1},
    storyFlags:{}, visited:{}, tarotUnlocked:false, tarotCount:0,
    diary:[], rpPool:[],
    echoes:[{day:1,act:'在水仙花街 2 号醒来，此后行止与从前略有不同'}],
    ledger:[{day:1,text:'黑荆棘安保公司录用为实习文员，周薪 '+fmtMoney(ECONOMY.weeklyWage)+'；本周房租待结。'}],
    worldLog:[], relations:{}, factions:{}, worldFlags:{}, debt:0,
    commission:{done:0,failed:0,doneDay:0,log:[]},
    billState:{week:0,paid:false,remitted:false,skipped:false},
  };
}
function normalizeG(){
  if(!G) return;
  if(typeof G.madness!=='number') G.madness=0;
  if(typeof G.gold!=='number') G.gold=12;
  if(typeof G.day!=='number') G.day=1;
  // 旧档 / 异常存档兜底：避免 curSeq() 为 undefined、消化度 NaN% 导致整页崩溃
  if(typeof G.seq!=='number'||!isFinite(G.seq)) G.seq=9;
  G.seq=Math.max(0,Math.min(9,Math.round(G.seq)));
  if(typeof G.acting!=='number'||!isFinite(G.acting)) G.acting=0;
  if(typeof G.actingNeed!=='number'||!isFinite(G.actingNeed)||G.actingNeed<=0) G.actingNeed=30+(9-G.seq)*14;
  if(typeof G.tarotCount!=='number') G.tarotCount=0;
  if(typeof G.tarotUnlocked!=='boolean') G.tarotUnlocked=!!G.tarotUnlocked;
  G.madness=Math.max(0,Math.min(100,G.madness));
  if(typeof G.gold!=='number'||!isFinite(G.gold)) G.gold=12;
  if(!G.inv) G.inv={};
  if(!G.storyFlags) G.storyFlags={};
  if(!G.visited) G.visited={};
  // 值夜者名录：旧档没有委托记录时补默认值，避免读档后委托卡白屏
  if(!G.commission||typeof G.commission!=='object') G.commission={done:0,failed:0,doneDay:0,log:[]};
  if(typeof G.commission.done!=='number') G.commission.done=0;
  if(typeof G.commission.failed!=='number') G.commission.failed=0;
  if(typeof G.commission.doneDay!=='number') G.commission.doneDay=0;
  if(!Array.isArray(G.commission.log)) G.commission.log=[];
  if(!Array.isArray(G.diary)) G.diary=[];
  if(!Array.isArray(G.rpPool)) G.rpPool=[];
  if(!G.attrs||typeof G.attrs!=='object') G.attrs={灵性:4,灵感:6,体魄:5,意志:6,学识:7,魅力:5};
  ATTR_KEYS.forEach(k=>{ if(typeof G.attrs[k]!=='number') G.attrs[k]=5; });
  // 旧档途径迁移：合并 / 归并后，将原 key 映射到现行 key（redpriest→hunter、war→twilight、chained→prisoner）
  const PATHWAY_MIGRATE={'redpriest':'hunter','war':'twilight','chained':'prisoner'};
  if(PATHWAY_MIGRATE[G.pathway]) G.pathway=PATHWAY_MIGRATE[G.pathway];
  if(!PATHS[G.pathway]) G.pathway='fool';
  // 旧档兼容：补齐穿越者档案
  if(!G.origin||typeof G.origin!=='object') G.origin={};
  const o=G.origin;
  if(!Array.isArray(o.recalled)) o.recalled=[];
  if(!o.modernName) o.modernName='你';
  if(!o.job) o.job='clerk';
  if(!o.jobName) o.jobName=MODERN_JOBS[0].name;
  if(!o.bodyName) o.bodyName=ORIGIN.body;
  if(!o.bodyEn) o.bodyEn=ORIGIN.bodyEn;
  if(!o.address) o.address=ORIGIN.address;
  if(!o.world) o.world=ORIGIN.world;
  if(!Array.isArray(o.memories)) o.memories=[];
  if(!o.react) o.react='calm';
  if(typeof o.suspicion!=='number') o.suspicion=0;
  if(typeof o.frag!=='number') o.frag=0;
  // 活的世界：旧档补齐（读档后世界照常运转）
  if(typeof G.gold!=='number'||!isFinite(G.gold)) G.gold=0;
  if(!Array.isArray(G.echoes)) G.echoes=[];
  if(!Array.isArray(G.ledger)) G.ledger=[];
  if(!Array.isArray(G.worldLog)) G.worldLog=[];
  if(!G.relations||typeof G.relations!=='object') G.relations={};
  if(!G.factions||typeof G.factions!=='object') G.factions={};
  if(!G.worldFlags||typeof G.worldFlags!=='object') G.worldFlags={};
  if(!G.city||(G.city!=='tingen'&&G.city!=='backlund')) G.city='tingen';
  if(!G.commission||typeof G.commission!=='object') G.commission={done:0,failed:0,doneDay:0,log:[]};
  if(!G.billState||typeof G.billState!=='object') G.billState=null;
  if(typeof G.debt!=='number') G.debt=0;
  if(G.echoes.length===0) G.echoes=[{day:G.day,act:'在水仙花街 2 号醒来，此后行止与从前略有不同'}];
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(SAVE_KEY); if(s){ G=JSON.parse(s); normalizeG(); return true; } }catch(e){} return false; }
function wipeSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} modalLocked=false; G=null; resetIntro(); renderPrologue(); }

/* ========================= 途径/序列 helper ========================= */
function seqsOf(pw){ return PATHS[pw].seqs; }
function curSeq(){ return PATHS[G.pathway].seqs[9-G.seq]; }
function nextSeq(){ if(G.seq<=0) return null; return PATHS[G.pathway].seqs[9-(G.seq-1)]; }
function has(mats){ for(const k in mats){ if((G.inv[k]||0) < mats[k]) return false; } return true; }
function hasObj(arr){ return arr.every(m=>(G.inv[m]||0)>=1); }
function addInv(o){ for(const k in o){ G.inv[k]=(G.inv[k]||0)+o[k]; if(G.inv[k]<=0) delete G.inv[k]; } }
function takeInv(o){ for(const k in o){ G.inv[k]=(G.inv[k]||0)-o[k]; if(G.inv[k]<=0) delete G.inv[k]; } }

/* ---- 晋升材料闭环：探索夺取 / 黑市保底采购 ---- */
function mainMatName(){ const n=nextSeq(); return n?n.rec.main:null; }
function mainMatPrice(){ const n=nextSeq(); return n?(30+(9-n.seq)*10):0; } // 序列8=40 金镑，越高序列越贵
const AUX_PRICE=10;
function grantMainMat(){
  const m=mainMatName(); if(!m) return null;
  if((G.inv[m]||0)>=1){ G.gold+=10; return 'duplicate'; } // 已持有则折成金镑，避免背包堆废料
  G.inv[m]=1; return m;
}
function buyMainMat(){
  const m=mainMatName(); if(!m) return;
  if((G.inv[m]||0)>=1){ toast('已持有该序列非凡特性'); return; }
  const price=mainMatPrice();
  if(G.gold<price){ toast('金镑不足，需 '+price+' 金镑'); return; }
  G.gold-=price; G.inv[m]=1;
  save(); updateTop(); renderView(); toast('重金购得 '+m);
}
function buyAuxMat(i){
  const n=nextSeq(); if(!n) return;
  const m=n.rec.aux[i]; if(!m) return;
  if((G.inv[m]||0)>=1){ toast('已持有 '+m); return; }
  if(G.gold<AUX_PRICE){ toast('金镑不足，需 '+AUX_PRICE+' 金镑'); return; }
  G.gold-=AUX_PRICE; G.inv[m]=1;
  save(); updateTop(); renderView(); toast('购入 '+m);
}

function optGainTxt(o){
  // 只列出「确定到手」的所得；检定成功才给的奖励由调用方单独以 {g:win,mat,char,main} 传入显示，
  // 避免玩家在选项按钮上看到失败时拿不到的物品。
  let t=[]; if(o.g&&o.g.acting) t.push('扮演 +'+o.g.acting); if(o.g&&o.g.gold) t.push('金镑 '+(o.g.gold>0?'+':'')+o.g.gold);
  if(o.g&&o.g.mad) t.push('疯狂 '+(o.g.mad>0?'+':'')+o.g.mad);
  if(o.atr) for(const k in o.atr) t.push(ATTR_META[k].name+' +'+o.atr[k]);
  if(o.mat) t.push(o.mat+'×1'); if(o.char) t.push(o.char+'×1');
  if(o.main) t.push('『序列非凡特性』×1');
  return t.join(' · ');
}

/* ========================= 能力检定（绑定角色属性） ========================= */
function abilityCheck(attrKey, diff){
  const tier=9-G.seq; // 0(弱)~9(强) 序列等级加成
  const av=(G.attrs && G.attrs[attrKey]!=null)?G.attrs[attrKey]:5; // 属性值
  let chance=0.35 + av*0.03 + tier*0.03 - (diff||0)*0.12;
  chance=Math.max(0.12,Math.min(0.95,chance));
  return Math.random()<chance;
}

function addSuspicion(n){

/* ---------- 值夜者名录 · 编外委托 ---------- */
function commissionUnlocked(){ return !!(G&&G.storyFlags&&G.storyFlags.bkNetDone); }
function commissionRank(){
  ensureWorld(); const done=(G.commission&&G.commission.done)||0;
  let idx=0; for(let i=0;i<COMMISSION_RANKS.length;i++){ if(done>=COMMISSION_RANKS[i].need) idx=i; }
  const r=COMMISSION_RANKS[idx], next=COMMISSION_RANKS[idx+1]||null;
  return {idx:idx,done:done,name:r.name,mul:r.mul,maxtier:r.maxtier,desc:r.desc,next:next,left:next?next.need-done:0};
}
function commissionOf(day,rank){
  const pool=COMMISSIONS.filter(c=>c.tier<=(rank||commissionRank()).maxtier);
  return pool[(((day-1)%pool.length)+pool.length)%pool.length];
}
function takeCommission(){
  ensureWorld();
  if(!commissionUnlocked()){ toast('名录尚未向你敞开'); return; }
  const c=G.commission;
  if(c.doneDay===G.day){ toast('今日的委托已经办过了，明日再来'); return; }
  const day0=G.day, rank=commissionRank(), job=commissionOf(G.day,rank);
  const success=abilityCheck(job.attr,job.diff);
  c.doneDay=day0;
  let gold=0, acting=0, levelUp=null;
  if(success){
    const rw=job.reward, mul=rank.mul;
    gold=Math.round((rw.gold||0)*mul); acting=Math.round((rw.acting||0)*mul);
    G.gold=+(G.gold+gold).toFixed(4); G.acting+=acting;
    if(rw.mad) G.madness=Math.max(0,Math.min(100,G.madness+rw.mad));
    if(rw.mat) addInv({[rw.mat]:1});
    if(rw.sus) addSuspicion(rw.sus);
    faction('nighthawk',rw.nh||2);
    c.done=(c.done||0)+1;
    c.log.unshift({day:day0,title:job.title,ok:true});
    addLedger('办妥值夜者委托「'+job.title+'」，名录资历 +1。');
    const after=commissionRank(); if(after.idx>rank.idx) levelUp=after;
  } else {
    c.failed=(c.failed||0)+1;
    G.gold=+(G.gold+2).toFixed(4);
    G.madness=Math.max(0,Math.min(100,G.madness+5));
    addSuspicion(2);
    c.log.unshift({day:day0,title:job.title,ok:false});
    addLedger('值夜者委托「'+job.title+'」未能办妥，只领了车马费。');
  }
  if(c.log.length>12) c.log.length=12;
  G.madness=Math.max(0,Math.min(100,G.madness));
  advanceDay('值夜者委托：'+job.title,
    success?'值夜者名单上又多了办妥的一笔':'值夜者那边有人空手回来，没提缘由','blackthorn');
  save(); renderView();
  const gainTxt=success
    ? `${gold} 金镑 · 扮演 +${acting}${job.reward.mat?' · '+job.reward.mat+' ×1':''}${job.reward.mad?(' · 疯狂 '+(job.reward.mad>0?'+':'')+job.reward.mad):''} · 值夜者态度 +${job.reward.nh||2} · 名录资历 +1`
    : '车马费 2 金镑 · 疯狂 +5 · 暴露 +2 · 名录资历不变';
  const after=commissionRank();
  showModal(`<span class="x" onclick="closeModal();renderView()">✕</span>
    <h2>🌙 ${job.title}</h2>
    <p class="lead">${success?job.win:job.fail}</p>
    <p class="mini ${success?'res-good':'res-bad'}">${success?'办妥了。':'没办成。'}获得：${gainTxt}。推进一日。</p>
    ${levelUp?`<p class="mini" style="color:var(--gold)">✦ 名录资历晋升：<b>${levelUp.name}</b>。${levelUp.desc} 从明日起，值夜者会派更重的活给你。</p>`:''}
    <p class="mini">名录：<b style="color:var(--teal)">${after.name}</b> · 已办妥 ${after.done} 件${after.next?`（距「${after.next.name}」还差 ${after.left} 件）`:'（已抵名录尽头）'} · 报酬倍率 ×${after.mul.toFixed(1)}</p>
    <div class="btn-row"><button class="btn primary" onclick="closeModal();renderView()">合上卷宗</button></div>`);
  if(G.madness>=100) setTimeout(gameOver,500);
}

  const loc=LOCATIONS.find(l=>l.id===id); const ev=loc.ev;

function resolveLocation(id,idx){
  const loc=LOCATIONS.find(l=>l.id===id); const o=loc.ev.opts[idx];
  let win=false, success=true;
  if(o.act==='tarot'){ doTarotInner(); return; }
  if(o.check>0){ success=abilityCheck(o.attr||'灵感', o.check); }
  // apply
  if(o.g.acting) G.acting+=o.g.acting;
  if(o.g.gold) G.gold+=o.g.gold;
  if(o.g.mad) G.madness+=o.g.mad;
  if(o.m) G.madness+=o.m;
  if(o.atr) applyAttr(o.atr);
  if(success && o.win){
    win=true;
    if(o.win.gold) G.gold+=o.win.gold;
    if(o.win.mad) G.madness+=o.win.mad;
    if(o.win.char) G.inv[o.win.char]=(G.inv[o.win.char]||0)+1;
    if(o.win.mat) G.inv[o.win.mat]=(G.inv[o.win.mat]||0)+1;
    if(o.win.main){ if(grantMainMat()==='duplicate') toast('已持有该序列特性，折为 10 金镑'); }   // 剥离出当前晋升目标所需的非凡特性
    if(o.win.atr) applyAttr(o.win.atr);
    if(o.win.flag){ if(!G.storyFlags) G.storyFlags={}; G.storyFlags[o.win.flag]=1; }   // 剧情线旗标（如贝克兰德暗涌）
    if(o.win.diary){ G.diary.unshift({day:G.day,seq:curSeq().name,title:loc.ev.title+' · 暗涌',fit:'ok',opt:o.win.diary,diary:o.win.diary}); if(G.diary.length>40) G.diary.length=40; }
  }
  G.madness=Math.max(0,Math.min(100,G.madness));
  G.visited[id]=true;
  advanceDay(loc.ev.title, LOC_ECHO[id]||('被人瞧见出入'+loc.name), id);
  addFrag();
  if(!success) addSuspicion(2);   // 检定失手，举止露了破绽
  if(o.sus) addSuspicion(o.sus);
  save(); updateTop();
  const resTxt = (!o.check||success)
    ? `<p class="mini res-good">${o.win&&win?'行动成功，额外获得 '+optGainTxt({g:o.win,mat:o.win.mat,char:o.win.char,main:o.win&&o.win.main})+'。':'行动顺利。'}</p>`
    : `<p class="mini res-bad">${ATTR_META[o.attr||'灵感'].name}不足，检定失败——你勉强脱身，但${o.m?('疯狂 +'+o.m):'无功而返'}。</p>`;
  const s=curSeq();
  showModal(`<span class="x" onclick="closeModal();renderView()">✕</span>
    <h2>${loc.ev.title}</h2>
    <p class="lead">${o.t}。</p>
    <p class="mini">${(o.check>0&&!success)?'行动所得':'获得'}：${optGainTxt({g:o.g,atr:o.atr,mat:o.mat})||'无'}</p>
    ${resTxt}
    <p class="mini">当前序列：<b style="color:var(--gold)">${s.name}</b>（${Math.floor(G.acting)}/${G.actingNeed} 消化） · 疯狂 ${Math.floor(G.madness)}% · 身份暴露风险 <b class="${suspLabel().c}">${G.origin?G.origin.suspicion:0}%</b>。</p>
    <div class="btn-row"><button class="btn primary" onclick="closeModal();renderView()">返回地图</button></div>`);
  if(G.madness>=100){ setTimeout(gameOver,500); }
}

/* 「来自另一个世界」的专属解法：只有序章携带对应认知才会出现 */
function resolveModern(id){
  const loc=LOCATIONS.find(l=>l.id===id), m=MODERN_SOLUTIONS[id];
  if(!loc||!m) return;
  const mems=(G.origin&&G.origin.memories)||[];
  if(m.mem && mems.indexOf(m.mem)<0) return;
  if(m.g.acting) G.acting+=m.g.acting;
  if(m.g.gold) G.gold+=m.g.gold;
  if(m.g.mad) G.madness+=m.g.mad;
  if(m.atr) applyAttr(m.atr);
  if(m.mat) G.inv[m.mat]=(G.inv[m.mat]||0)+1;
  G.madness=Math.max(0,Math.min(100,G.madness));
  G.visited[id]=true;
  advanceDay(loc.ev.title+' · 来自另一个世界', LOC_ECHO[id]||('被人瞧见出入'+loc.name), id);
  addFrag();
  G.diary.unshift({day:G.day,seq:curSeq().name,title:loc.ev.title+' · 来自另一个世界',
    fit:'perfect',opt:m.title,diary:m.diary});
  if(G.diary.length>40) G.diary.length=40;
  addSuspicion(m.sus||0);
  save(); updateTop();
  const sl=suspLabel();
  showModal(`<span class="x" onclick="closeModal();renderView()">✕</span>
    <h2>${loc.ev.title}</h2>
    <p class="lead">${m.em} ${m.title}。</p>
    <p class="mini">这个时代还没有这样的思路。你用得很顺手，也因此，稍稍不像「他」。</p>
    <div class="soliloquy">${m.diary}</div>
    <p class="mini">获得：${optGainTxt({g:m.g,atr:m.atr,mat:m.mat})}</p>
    <p class="mini">身份暴露风险：<b class="${sl.c}">${G.origin?G.origin.suspicion:0} / 100 · ${sl.t}</b>${m.sus<0?'（对镜练习让你更稳妥了）':''}</p>
    <div class="btn-row"><button class="btn primary" onclick="closeModal();renderView()">返回地图</button></div>`);
  if(G.madness>=100) setTimeout(gameOver,500);
}

function doPromote(n){

  // 防御：任何路径（含未刷新的旧按钮）都不得在材料不齐时再次结算晋升

  takeInv({[rec.main]:1}); rec.aux.forEach(m=>takeInv({[m]:1}));
  let mad=n.mad;
  if(G.acting>=G.actingNeed){ mad=Math.floor(mad*0.25); toast('扮演充分，疯狂增量大幅抵消'); }
  else { mad=Math.floor(mad*1.6); }
  G.madness=Math.max(0,Math.min(100,G.madness+mad)); G.seq=n.seq; G.acting=0; G.actingNeed=30+(9-n.seq)*14;
  save(); updateTop(); renderView();
  if(G.madness>=100){ showModal(`<span class="x" onclick="restartGame()">✕</span><h2>🌀 晋升即失控</h2>
    <p class="lead">魔药灌下去的那一刻，你就知道错了——灵性像碎掉的玻璃，再也拼不回去。</p>
    <p class="mini">你倒在 <b style="color:var(--gold)">${PATHS[G.pathway].name} · ${n.name}</b> 的门槛上，历 ${G.day} 日。</p>
    <div class="btn-row"><button class="btn primary" onclick="restartGame()">重开新局</button></div>`);
    modalLocked=true; return; }
  if(G.seq===0){ ascendEnd(mad); return; }   // 序列 0：专属「登临旧日」结算
  showModal(`<span class="x" onclick="closeModal();curView='status';renderView()">✕</span><h2>⚗ 晋升成功</h2>
    <p class="lead">你饮下魔药，灵性剧烈翻涌——登临 <span style="color:var(--gold)">${n.name}</span>${PATHS[G.pathway].real?'（序列 '+n.seq+'）':''}。</p>
    <p class="mini">本次疯狂增量：<b style="color:var(--blood)">+${mad}</b>（当前疯狂 ${Math.floor(G.madness)}%）。</p>
    <p class="lead">新能力：${n.ab.map(a=>a[0]).join('、')}。</p>
    <div class="btn-row"><button class="btn primary" onclick="closeModal();curView='status';renderView()">查看档案</button></div>`);
}

  ];

  c.innerHTML=`<h2>扮演 · ${s.name}</h2>
    <p class="lead">扮演法是非凡者消化魔药、远离失控的核心。在情境中"成为"你的序列、按守则行动，既能加速成长，又能压低晋升的疯狂。<br><span style="color:var(--gold)">守则：</span>${s.act}</p>

    <p class="mini">💼 序列越高，你在廷根能接的活越值钱，也越懂扮演法：「市井兼职」报酬 <b style="color:var(--gold)">${6+tier*3} 金镑</b> / 日，「日常潜伏」消化 <b style="color:var(--gold)">+${6+tier}</b>。晋升所需的非凡特性与辅料，可在「晋升」页黑市求购，或去查尼斯门 / 东区冒险夺取。</p>`;

    b.innerHTML=`<div>${a.t} — ${a.d}</div><div class="gain">${gainTxt.join(' · ')}</div><div class="cost">${madTxt}</div>`;

  });
  v.appendChild(c);
  v.appendChild(renderDiary());
};
function doAct(a){
  if(a.g.acting) G.acting+=a.g.acting; if(a.g.gold) G.gold+=a.g.gold;
  if(a.atr) applyAttr(a.atr);
  G.madness+=a.m; if(G.madness<0)G.madness=0; if(G.madness>100)G.madness=100;
  advanceDay(a.t, a.echo||'按部就班地过了寻常一日', 'home'); save(); updateTop(); renderView(); toast(a.t+' 完成');
  if(G.madness>=100) gameOver();
}
function rollRoleplay(){
  if(G.rpPool.length===0) G.rpPool=ROLEPLAY_EVENTS.map(e=>e.id);
  const id=G.rpPool.splice(Math.floor(Math.random()*G.rpPool.length),1)[0];
  save();   // 事件池即时落盘，避免刷新后反复抽到同一情境
  const ev=ROLEPLAY_EVENTS.find(e=>e.id===id);
  showModal(`<span class="x" onclick="closeModal()">✕</span>
    <h2>⚑ ${ev.title}</h2><p class="lead">${ev.scene}</p>
    ${ev.opts.map((o,i)=>`<button class="choice" onclick="resolveRoleplay('${ev.id}',${i})">
        <div>${o.label}</div><div class="gain">${optGainTxt(o)}${o.check>0?' · 需 '+ATTR_META[o.attr||'灵感'].name+' 检定（难度 '+o.check+'）':''}</div></button>`).join('')}
    <p class="mini">提示：选择越贴合你序列的守则（${curSeq().act}），评价越高、消化越充分、疯狂越低。</p>`);
}
function resolveRoleplay(evId,idx){
  const ev=ROLEPLAY_EVENTS.find(e=>e.id===evId); const o=ev.opts[idx];
  const fitLabel={perfect:'完美扮演',ok:'尚可',fail:'失格'}[o.fit];
  let success=true, win=false;
  if(o.check>0) success=abilityCheck(o.attr||'灵感',o.check);
  if(o.g.acting) G.acting+=o.g.acting; if(o.g.gold) G.gold+=o.g.gold;
  if(o.g.mad) G.madness+=o.g.mad; if(o.m) G.madness+=o.m;
  if(o.atr) applyAttr(o.atr);
  if(success && o.win){
    win=true;
    if(o.win.gold) G.gold+=o.win.gold;
    if(o.win.mad) G.madness+=o.win.mad;
    if(o.win.mat) G.inv[o.win.mat]=(G.inv[o.win.mat]||0)+1;
    if(o.win.atr) applyAttr(o.win.atr);
  }
  if(!success) addSuspicion(2);
  if(o.fit==='fail') addSuspicion(3);
  G.madness=Math.max(0,Math.min(100,G.madness));
  advanceDay(ev.title,'独自在雾中伫立良久','roleplay');
  const monologue=o.diary||'（这一幕太乱了，我没能替自己记下什么。只记得心跳很响，雾很凉。）';
  G.diary.unshift({day:G.day,seq:curSeq().name,title:ev.title,fit:o.fit,opt:o.label,diary:monologue});
  if(G.diary.length>40) G.diary.length=40;
  save(); updateTop();
  const extra=win?(' · 额外收获 '+optGainTxt({g:o.win})):'';
  const failTxt=!success?' · 检定失手，未能取得额外收获':'';
  showModal(`<span class="x" onclick="closeModal();renderView()">✕</span>
    <h2>⚑ ${ev.title} <span class="fit ${o.fit}">${fitLabel}</span></h2>
    <p class="mini">你的选择：<b>${o.label}</b></p>
    <div class="soliloquy">${monologue}</div>
    <p class="mini">获得：${optGainTxt(o)}${extra}${failTxt}${o.fit==='perfect'?' · 消化充分，晋升更稳':(o.fit==='fail'?' · 背离守则，警惕失控':'')}</p>
    <div class="btn-row"><button class="btn primary" onclick="closeModal();renderView()">合上日记</button></div>`);
  if(G.madness>=100) setTimeout(gameOver,400);
}
function renderDiary(){
  const w=document.createElement('div'); w.className='card diary';
  if(!G.diary.length){ w.innerHTML='<h3>扮演履历 · 你的日记</h3><p class="diary-empty">尚无扮演记录。点击上方「遭遇扮演事件」，在情境中代入你的序列，写下第一笔日记。</p>'; return w; }
  let h='<h3>扮演履历 · 你的日记</h3>';
  G.diary.slice(0,18).forEach(d=>{
    const fl={perfect:'完美',ok:'尚可',fail:'失格'}[d.fit];
    h+=`<div class="diary-item"><div class="dh">第 ${d.day} 日 · ${d.seq} · ${fl}</div>
      <div>${d.title}：<b>${d.opt}</b></div><div class="dm">${d.diary}</div></div>`;
  });
  w.innerHTML=h; return w;
}

      <div class="row"><b>本城</b><span>廷根：黑荆棘安保公司、圣堂、查尼斯门、廷根大学、东区与港口</span></div>
      <div class="row"><b>海洋</b><span>迷雾海、苏尼亚海；神弃之地与白银城在传说之外</span></div>
      <div class="row"><b>正教</b><span>黑夜女神、风暴之主、永恒烈阳、大地母神、知识与智慧之神、战神</span></div>
      <div class="row"><b>隐秘</b><span>值夜者、极光会、密修会、玫瑰学派、塔罗会，以及灰雾之上的王座</span></div>
    </div>
    <p class="mini">游戏采用每月 30 日、七日一周的简化历法；日期、天气、节庆与报纸均为可玩性而设的原创演绎，<b>不冒充原著逐日纪事</b>。</p>`;
  v.appendChild(c6);

  const c7=document.createElement('div'); c7.className='card';
  c7.innerHTML=`<h2>二十二途径 · 入口序列考据</h2>
    <p class="mini">下表逐条标明序列 9 名称的核对状态。✅ 与公开资料一致；⚠️ 存在整理口径差异；🕯️ 游戏整理条目。<b>中间序列仍为占位，一律以原著为准。</b></p>
    <div class="acts">${Object.keys(PATHS).map(k=>{const p=PATHS[k], nt=PATH_NOTES[k]||{s:'整理',n:'待考'};
      const em=nt.s==='核对'?'✅':(nt.s==='差异'?'⚠️':'🕯️');
      return `<span class="ab" style="${k===G.pathway?'border-color:var(--gold)':''}"><b>${em} ${p.name} · 序列9「${p.entry||p.seqs[0].name}」</b> · ${nt.n}</span>`;}).join('')}</div>
    <p class="mini">已修正的旧错配：死神 通灵者→收尸人、月亮 收尸人→药师、红祭司 医师→猎人、黑暗 隐者→不眠者、魔女 魔女→刺客、深渊 魔鬼→罪犯、囚犯 犯人→囚犯。<br>
      ⚠️ 考据说明：本作已消除「猎人 / 红祭司分列」「战神 / 黄昏巨人分列」两处原结构差异，现二十二途径名册严格对齐原著。仅余「深渊（罪犯）/ 被缚者（囚犯）」的序列 0 归属在个别整理资料中仍有分歧，此处如实标注，不冒称考据定论。</p>`;
  v.appendChild(c7);

  const c8=document.createElement('div'); c8.className='card';
  c8.innerHTML=`<h2>💰 货币与物价</h2>
    <div class="pro-meta">
      <div class="row"><b>换算</b><span>1 金镑 = 20 苏勒 = 240 便士（原著设定）</span></div>
      <div class="row"><b>周薪</b><span>${fmtMoney(ECONOMY.weeklyWage)} · 黑荆棘实习文员</span></div>
      <div class="row"><b>房租</b><span>${fmtMoney(ECONOMY.weeklyRent)} / 周</span></div>
      <div class="row"><b>膳宿杂项</b><span>${fmtMoney(ECONOMY.dailyMeal)} / 日（三餐、煤气与一份报纸）</span></div>
      <div class="row"><b>家用</b><span>${fmtMoney(ECONOMY.remittance)} / 周 · 寄给班森与梅丽莎</span></div>
    </div>
    <p class="mini">具体物价为游戏化平衡数值；换算关系、职业与生活方式沿用原著。账单在「今日世界」亲手结算——拖欠会在报纸与门上留下痕迹。</p>`;
  v.appendChild(c8);
};

/* ========================= 启动 ========================= */
function boot(){
  if(load() && G && G.pathway && PATHS[G.pathway]){
    curView='status'; buildTabs(); renderView();
    // 终局存档刷新后仍需结算：否则 ESC / 刷新可绕过失控与暴露
    if(G.storyFlags && G.storyFlags.exposed) exposeEnd();
    else if(G.madness>=100) gameOver();
  } else {
    resetIntro(); renderPrologue();
  }
}
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
boot();
</script>
</body>
</html>
